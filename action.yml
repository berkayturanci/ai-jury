name: "ai-jury Review"
description: "Convene a cross-vendor multi-agent code review jury on pull requests"
author: "Berkay Turancı"
branding:
  icon: "check-circle"
  color: "indigo"

inputs:
  github-token:
    description: "GitHub Token for posting PR comments and inspecting diffs"
    required: false
    default: "${{ github.token }}"
  openai-api-key:
    description: "OpenAI API Key for Codex/GPT reviewers"
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API Key for Claude reviewers"
    required: false
    default: ""
  gemini-api-key:
    description: "Gemini API Key for Google reviewers"
    required: false
    default: ""
  args:
    description: "Additional arguments to pass to the jury CLI (e.g. '--post --auto')"
    required: false
    default: "--auto --post"
  version:
    description: "ai-jury package version to install (defaults to latest)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.13"

    - name: Install ai-jury
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          python -m pip install "ai-jury==${{ inputs.version }}"
        else
          python -m pip install ai-jury
        fi

    - name: Run ai-jury
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: |
        PR_NUM="${{ github.event.pull_request.number }}"
        if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
          jury --pr "$PR_NUM" ${{ inputs.args }}
        else
          git diff "origin/${{ github.base_ref }}...HEAD" | jury --diff-file - ${{ inputs.args }}
        fi
