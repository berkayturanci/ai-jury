# ai-jury configuration
#
# Each [[agent]] wraps a native coding-agent CLI invoked in headless mode.
# `command` must be resolvable on PATH (verified with shutil.which). Disabled or
# unavailable agents are skipped with a warning unless --strict is passed.

[jury]
# Number of rounds: 1 = independent review only, 2 = review + debate/rebuttal.
rounds = 2
# Agent that synthesizes the final verdict. Must match an [[agent]] name below,
# or the literal "rotate" to pick a chair deterministically per run from the
# usable agents using the run seed (mitigates chair self-preference bias, #38).
# If a named chair is unavailable, the first available agent is used.
chair = "claude"
# When the configured chair is not a usable agent, prefer a usable agent that
# was NOT a round-1 reviewer (a neutral chair) before falling back to the first
# usable agent (#38). No effect when chair = "rotate" or names a usable agent.
prefer_non_reviewer_chair = false
# Round-2 debate: show each debater the OTHER reviewers' round-1 findings with
# identity stripped ("Reviewer A/B/...") in a per-debater, seed-deterministic
# order (Chatham House rule, #37) to remove identity + position bias. The
# rendered report still attributes every finding by real agent name. Set false
# for the legacy identity-labeled debate. When the resolved chair is also a
# reviewer, this same anonymization is applied to the synthesis input so the
# chair cannot preferentially weight its own findings; the CI gate is structured
# (ci.evaluate_ci over votes) and never derived from chair prose, so anonymizing
# the prose cannot change the gate.
anonymize_debate = true
# Per-agent wall-clock timeout in seconds (can be overridden per agent). A hung
# CLI is killed at this bound and recorded as a failed review; the run continues.
timeout = 300
# Run agents concurrently within a round.
parallel = true
# Run a verification round (chair judges candidate findings) before synthesis to
# reduce false positives. Disable with --no-verify.
verify = true

# Adaptive rounds (#40): when early_stop is true the debate round is skipped if
# the round-1 reviewers already agree, and otherwise runs up to max_rounds,
# stopping as soon as a round resolves all disputes. A fixed --rounds disables
# this for reproducible benchmarking. max_rounds defaults to `rounds`.
# early_stop = false
# max_rounds = 3

# Execution controls (#30), all optional and off by default. total_timeout /
# phase_timeout bound the whole run / a single phase (seconds); the effective
# per-call timeout is the min of the agent timeout and these budgets. retries is
# the number of extra attempts for transient failures (timeout/rate-limit/spawn).
# total_timeout = 1200
# phase_timeout = 600
# retries = 0

# Large-diff handling (#31). The diff is measured + filtered before review;
# over-budget diffs are chunked (chunk = true) or rejected with a clear message.
# exclude_generated drops binary/generated/vendored files; exclude/include are
# extra path-glob deny/allow lists.
# [jury.diff]
# max_bytes = 200000
# chunk = false
# chunk_max_bytes = 200000
# exclude_generated = true
# exclude = ["docs/**", "*.lock"]
# include = []

# CI gate: when `jury --ci` is used, exit non-zero if any finding has a
# severity in `fail_on`. When `ignore_unverified` is true, only findings the
# verifier marked "verified" can fail the build (unverified ones never fail).
[jury.ci]
fail_on = ["critical", "major"]
ignore_unverified = true
# Cross-vendor guard (#682): distinct vendors that must have CONTRIBUTED a review
# before the run may stand as cross-vendor consensus. Below it the run exits 3
# instead of 0 — an agent can be installed, probe clean, and still return nothing
# (#635), which is how a three-vendor panel silently becomes one. It only applies
# when 2+ distinct vendors are enabled, so a deliberate single-agent setup is
# untouched. Set 0 (or pass --no-min-vendors) to accept a collapsed panel.
min_vendors = 2

# Context policy: what gets sent to each agent, and whether secrets are redacted.
# mode = "diff-only" sends only the diff; "expanded" also sends PR context.
# redact_secrets scrubs recognized secrets from the diff + context before sending.
[jury.context]
mode = "diff-only"
redact_secrets = true

[[agent]]
name = "claude"
vendor = "anthropic"
command = "claude"
# model = "claude-opus-4-8"   # optional; omit to use the CLI default
# Read-only review: --disallowed-tools removes mutating tools entirely, while
# --dangerously-skip-permissions stops `-p` from blocking on a permission prompt
# in non-interactive mode (the two combine: no mutations AND no hangs).
extra_args = [
    "--output-format", "text",
    "--disallowed-tools", "Edit,Write,NotebookEdit,Bash",
    "--dangerously-skip-permissions",
]

[[agent]]
name = "codex"
vendor = "openai"
command = "codex"
# model = "gpt-5-codex"
# `codex exec` receives the prompt on stdin (no positional prompt, so it never
# hangs waiting for input non-interactively). The diff is fetched by the jury
# (`gh`), not by codex, so the reviewer only needs to READ its prompt and print a
# review — `-s read-only` is the secure default (#100). Widen it only if your
# workflow truly needs it: `-s workspace-write` or `-s danger-full-access`.
extra_args = ["-s", "read-only"]

[[agent]]
name = "agy"
vendor = "google"
command = "agy"
# Antigravity CLI; alias on interactive shells, real binary on PATH.
# `--dangerously-skip-permissions` avoids a non-interactive permission prompt
# hanging the run; `--sandbox` keeps the agent's tools restricted while it reads
# untrusted PR content (#100). Drop `--sandbox` only if you fully trust the diff.
extra_args = ["--dangerously-skip-permissions", "--sandbox"]

# Local / open-weight reviewer (#43): a free, offline panelist over any
# OpenAI-compatible server (Ollama, llama.cpp, vLLM, LM Studio). It talks plain
# HTTP (stdlib only) — no `command`, just an `endpoint` + `model`. Its value is
# vendor diversity at zero marginal cost, not parity with frontier models.
# Uncomment after `ollama pull qwen2.5-coder:7b`:
# [[agent]]
# name = "qwen"
# vendor = "local"
# model = "qwen2.5-coder:7b"
# endpoint = "http://localhost:11434/v1"   # default; Ollama's OpenAI-compatible API
