[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-jury"
version = "1.11.1"
description = "Cross-vendor multi-agent PR review jury — orchestrate native coding-agent CLIs (Claude Code, Codex, Antigravity) to mutually review and debate the same pull request."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Berkay Turancı" }]
maintainers = [{ name = "Berkay Turancı" }]
keywords = ["code-review", "llm", "multi-agent", "claude-code", "codex", "antigravity", "orchestration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "build>=1.2", "coverage>=7.5"]

[project.urls]
Homepage = "https://github.com/berkayturanci/ai-jury"
Issues = "https://github.com/berkayturanci/ai-jury/issues"
Changelog = "https://github.com/berkayturanci/ai-jury/blob/main/CHANGELOG.md"

[project.scripts]
jury = "ai_jury.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "PTH"]
ignore = ["E501"]
exclude = [
    ".git",
    "build",
    "dist",
    "venv",
    "__pycache__",
]

[tool.coverage.run]
# Measure the installed package by import name so coverage works whether the
# package is run from ``src/`` (PYTHONPATH) or an editable install.
source = ["ai_jury"]
branch = true
omit = [
    # Thin ``python -m ai_jury`` shim; only an entrypoint guard.
    "*/ai_jury/__main__.py",
]

[tool.coverage.report]
# Lines that are intentionally not exercised by the test suite.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
# Minimum total coverage. Keep at or just below the measured baseline so the
# gate reflects reality today; raise it deliberately as coverage improves.
# Current measured total ~99.95% (statements + branches): 0 uncovered statements,
# every module 100% except 2 documented-unreachable defensive branches in
# orchestrator.py. Raise deliberately as coverage improves.
fail_under = 99
