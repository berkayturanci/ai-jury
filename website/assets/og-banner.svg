<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- brand mark -->
  <g transform="translate(80,72)">
    <rect width="84" height="84" rx="20" fill="url(#mark)"/>
    <g transform="translate(42,42) scale(0.95) translate(-32,-32)" fill="#fff">
      <path d="M13 25 L32 12 L51 25 Z"/>
      <rect x="14" y="27" width="36" height="4" rx="1"/>
      <rect x="18" y="33" width="4.5" height="15"/>
      <rect x="27.75" y="33" width="4.5" height="15"/>
      <rect x="37.5" y="33" width="4.5" height="15"/>
      <rect x="13" y="50" width="38" height="4.5" rx="1.5"/>
    </g>
  </g>
  <text x="184" y="118" fill="#f8fafc" font-size="62" font-weight="800">ai-jury</text>
  <text x="186" y="158" fill="#94a3b8" font-size="25" font-weight="500">Cross-vendor multi-agent code review</text>

  <!-- tagline -->
  <text x="80" y="250" fill="#e2e8f0" font-size="38" font-weight="700">Install once. Run a cross-vendor review jury anywhere.</text>
  <text x="80" y="300" fill="#94a3b8" font-size="24" font-weight="400">Claude Code · Codex · Antigravity · a free local model — review the same diff,</text>
  <text x="80" y="334" fill="#94a3b8" font-size="24" font-weight="400">debate, verify, and synthesize one chair verdict. stdlib-only · local-first.</text>

  <!-- flow row -->
  <g transform="translate(80,400)">
    <!-- reviewer pills -->
    <g font-size="20" font-weight="600">
      <rect x="0"   y="0" width="150" height="56" rx="12" fill="#1e293b" stroke="#334155"/>
      <circle cx="24" cy="28" r="8" fill="#d97757"/><text x="40" y="35" fill="#f1f5f9">Claude</text>
      <rect x="166" y="0" width="150" height="56" rx="12" fill="#1e293b" stroke="#334155"/>
      <circle cx="190" cy="28" r="8" fill="#10a37f"/><text x="206" y="35" fill="#f1f5f9">Codex</text>
      <rect x="332" y="0" width="186" height="56" rx="12" fill="#1e293b" stroke="#334155"/>
      <circle cx="356" cy="28" r="8" fill="#4285f4"/><text x="372" y="35" fill="#f1f5f9">Antigravity</text>
      <rect x="534" y="0" width="150" height="56" rx="12" fill="#1e293b" stroke="#334155"/>
      <circle cx="558" cy="28" r="8" fill="#a855f7"/><text x="574" y="35" fill="#f1f5f9">Local</text>
    </g>
    <text x="710" y="35" fill="#818cf8" font-size="26" font-weight="700">⇄</text>
    <rect x="744" y="0" width="120" height="56" rx="12" fill="#312e81" stroke="#6366f1"/>
    <text x="760" y="35" fill="#e0e7ff" font-size="20" font-weight="600">chair ✓</text>
    <text x="884" y="35" fill="#64748b" font-size="26" font-weight="700">→</text>
    <rect x="918" y="0" width="202" height="56" rx="12" fill="#064e3b" stroke="#10b981"/>
    <text x="938" y="35" fill="#6ee7b7" font-size="20" font-weight="700">ONE VERDICT</text>
  </g>

  <text x="80" y="556" fill="#64748b" font-size="20" font-weight="500">pip install ai-jury  ·  github.com/berkayturanci/ai-jury  ·  MIT</text>
</svg>
