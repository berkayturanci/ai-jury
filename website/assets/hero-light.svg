    <text x="578" y="80" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;, monospace">ROUND 2</text>
    <text x="578" y="102" fill="#0c1322" font-size="17" font-weight="600" text-anchor="middle">debate ⇄</text>

    <rect x="686" y="48" width="124" height="72" rx="14" fill="#ffffff" stroke="#e2e7f3"></rect>
    <text x="748" y="80" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;, monospace">CHECK</text>
    <text x="748" y="102" fill="#0c1322" font-size="17" font-weight="600" text-anchor="middle">verify</text>

    <rect x="856" y="48" width="124" height="72" rx="14" fill="#ffffff" stroke="#a5b0f0"></rect>
    <text x="918" y="80" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;, monospace">SYNTHESIS</text>
    <text x="918" y="102" fill="#5457ec" font-size="15" font-weight="700" text-anchor="middle">chair · vote</text>

    <rect x="996" y="48" width="156" height="72" rx="14" fill="#ffffff" stroke="#6ee7b7"></rect>
    <text x="1074" y="78" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;, monospace">VERDICT</text>
