      <circle cx="216" cy="22" r="5" fill="#d97757"></circle><text x="230" y="27" fill="#0c1322" font-size="15" font-weight="600">Claude Code</text><text x="450" y="27" fill="#8a96ad" font-size="12" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, monospace">claude</text>
      <rect x="196" y="48" width="274" height="40" rx="10" fill="#ffffff" stroke="#10a37f"></rect>
      <circle cx="216" cy="68" r="5" fill="#10a37f"></circle><text x="230" y="73" fill="#0c1322" font-size="15" font-weight="600">Codex</text><text x="450" y="73" fill="#8a96ad" font-size="12" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, monospace">codex</text>
      <rect x="196" y="94" width="274" height="40" rx="10" fill="#ffffff" stroke="#4285f4"></rect>
      <circle cx="216" cy="114" r="5" fill="#4285f4"></circle><text x="230" y="119" fill="#0c1322" font-size="15" font-weight="600">Antigravity</text><text x="450" y="119" fill="#8a96ad" font-size="12" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, monospace">agy</text>
      <rect x="196" y="140" width="274" height="40" rx="10" fill="#ffffff" stroke="#a855f7"></rect>
      <circle cx="216" cy="160" r="5" fill="#a855f7"></circle><text x="230" y="165" fill="#0c1322" font-size="15" font-weight="600">Local / open-weight</text><text x="452" y="165" fill="#059669" font-size="11" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, monospace">free</text>
    </g>

