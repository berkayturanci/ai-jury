  <script>
  (function () {
    "use strict";

    var RAW_DOCS = RAW_ROOT + "docs/";
    var BLOB_ROOT = "https://github.com/" + OWNER + "/" + REPO + "/blob/" + BRANCH + "/";

    // Registry — grouped docs. slug -> file under docs/
    var GROUPS = [

        { slug: "configuration", file: "configuration.md", title: "Configuration" },
        { slug: "report-format", file: "report-format.md", title: "Report format" }
      ]},
      { title: "Guides", items: [

        { slug: "skill", file: "skill.md", title: "Skill packaging" },
        { slug: "security", file: "security.md", title: "Security" },
        { slug: "security-scan-2026-06-07", file: "security-scan-2026-06-07.md", title: "Security scan: 2026-06-07 (Codex analysis)" },
        { slug: "security-audit-2026-06-07", file: "security-audit-2026-06-07.md", title: "Security audit: 2026-06-07 (Claude analysis)" },
        { slug: "security-audit-2026-06-07-v1.3.0", file: "security-audit-2026-06-07-v1.3.0.md", title: "Security re-audit: v1.3.0 (Claude analysis)" },
        { slug: "security-audit-2026-06-07-v1.4.0", file: "security-audit-2026-06-07-v1.4.0.md", title: "Security re-audit: v1.4.0 (Claude analysis)" },
        { slug: "security-audit-2026-06-07-v1.4.1", file: "security-audit-2026-06-07-v1.4.1.md", title: "Security re-audit: v1.4.1 (Claude analysis)" },
        { slug: "security-audit-2026-06-07-v1.5.0", file: "security-audit-2026-06-07-v1.5.0.md", title: "Security re-audit: v1.5.0 (Claude analysis)" }
      ]},
      { title: "Examples", items: [
        { slug: "example-run", file: "example-run.md", title: "Example run" },

        { slug: "live-review-report", file: "live-review-report.md", title: "Full report — v1.1.0 (2026-06-04)" },
        { slug: "benchmark-results", file: "benchmark-results.md", title: "Benchmark: does the panel help?" }
      ]},
      { title: "Overview", items: [
        { slug: "positioning", file: "positioning.md", title: "Positioning" },
        { slug: "architecture", file: "architecture.md", title: "Architecture" },
        { slug: "feasibility", file: "feasibility.md", title: "Feasibility & prior art" },
        { slug: "comparison", file: "comparison.md", title: "Ecosystem comparison" }
      ]},
      { title: "Project", items: [
        { slug: "releasing", file: "releasing.md", title: "Releasing" },
        { slug: "release-checklist", file: "release-checklist.md", title: "Release checklist" }
      ]}
    ];
    var BY_SLUG = {};
    GROUPS.forEach(function (g) { g.items.forEach(function (it) { BY_SLUG[it.slug] = it; }); });
    // map "docs/<file>" -> slug for link rewriting
    var FILE_TO_SLUG = {};
    GROUPS.forEach(function (g) { g.items.forEach(function (it) { FILE_TO_SLUG["docs/" + it.file] = it.slug; }); });

    var $ = function (id) { return document.getElementById(id); };
    var sideEl = $("docs-side"), contentEl = $("doc-content");

    /* ---- theme + nav + mobile menu ---- */
    $("theme-toggle").addEventListener("click", function () {
      var light = document.documentElement.getAttribute("data-theme") === "light";
      var next = light ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      try { if (next === (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) localStorage.removeItem("theme"); else localStorage.setItem("theme", next); } catch (e) {}
    });
    var nav = $("nav");
    var __lastY = window.scrollY; var onScroll = function () { var y = window.scrollY; nav.classList.toggle("scrolled", y > 8); if (y > 200 && y > __lastY + 6) nav.classList.add("nav-hidden"); else if (y < __lastY - 6 || y <= 200) nav.classList.remove("nav-hidden"); document.body.classList.toggle("nav-up", nav.classList.contains("nav-hidden")); __lastY = y; };
    onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
    $("menu-btn").addEventListener("click", function () {
      var open = sideEl.classList.toggle("collapsed") === false;
      this.setAttribute("aria-expanded", open ? "true" : "false");
      this.innerHTML = open ? "✕ Close" : "☰ Menu";
      var bar = this.closest(".docs-mobilebar"); if (bar) bar.classList.toggle("open", open);
    });

    /* ---- sidebar ---- */
    function buildSidebar(activeSlug) {
      var html = '<p class="ds-label">Documentation</p><nav class="ds-nav">';
      html += '<a class="ds-link' + (!activeSlug ? " active" : "") + '" href="#">Home</a>';
      html += '<a class="ds-link" href="coverage.html">Test coverage</a>';
      html += "</nav>";
      GROUPS.forEach(function (g) {
        html += '<p class="ds-label">' + g.title + "</p><nav class=\"ds-nav\">";
        g.items.forEach(function (it) {
          html += '<a class="ds-link' + (it.slug === activeSlug ? " active" : "") + '" href="#' + it.slug + '">' + it.title + "</a>";
        });
        html += "</nav>";
      });
      html += '<p class="ds-label">On this page</p><nav class="ds-nav" id="toc"></nav>';
      sideEl.innerHTML = html;
    }

    function slugify(s) {
      return String(s).toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").replace(/-+/g, "-");
    }

    /* ---- link / image rewriting ---- */
    function resolveRel(href) {
      // resolve a relative path against docs/ using URL semantics
      try { return new URL(href, "https://x/docs/").pathname.replace(/^\//, ""); }
      catch (e) { return href; }
    }
    function rewrite(container) {
      // links
      Array.prototype.forEach.call(container.querySelectorAll("a[href]"), function (a) {
        var href = a.getAttribute("href");
        if (!href) return;
        if (/^(https?:)?\/\//i.test(href) || /^(mailto:|#)/i.test(href)) {
          if (/^https?:\/\//i.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
          return;
        }
        var frag = "";
        var hashIdx = href.indexOf("#");
        if (hashIdx >= 0) { frag = href.slice(hashIdx); href = href.slice(0, hashIdx); }
        if (!href) { return; } // pure fragment handled above
        var path = resolveRel(href);
        if (FILE_TO_SLUG[path]) { a.setAttribute("href", "#" + FILE_TO_SLUG[path] + (frag && frag !== "#" ? "" : "")); a.removeAttribute("target"); return; }
        // other repo file → blob (or raw for assets handled by img)
        a.setAttribute("href", BLOB_ROOT + path + frag);
        a.target = "_blank"; a.rel = "noopener";
      });
      // images
      Array.prototype.forEach.call(container.querySelectorAll("img[src]"), function (img) {
        var src = img.getAttribute("src");
        if (!src || /^(https?:)?\/\//i.test(src) || /^data:/i.test(src)) return;
        img.setAttribute("src", RAW_ROOT + resolveRel(src));
        img.loading = "lazy";
      });
      // wrap tables for horizontal scroll
      Array.prototype.forEach.call(container.querySelectorAll("table"), function (t) {
        if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains("md-table-wrap")) return;
        var w = document.createElement("div"); w.className = "md-table-wrap";
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      });
    }

    function buildTOC(container) {
      var toc = $("toc");
      if (!toc) return;
      var heads = container.querySelectorAll("h2, h3");
      var html = "";
      Array.prototype.forEach.call(heads, function (h) {
        var id = h.id || slugify(h.textContent);
        h.id = id;
        html += '<a class="ds-sub" data-id="' + id + '" href="#' + (location.hash.replace("#","").split("/")[0] || "") + '" style="' + (h.tagName === "H3" ? "padding-left:1.4rem" : "") + '">' + h.textContent + "</a>";
      });
      toc.innerHTML = html;
      // clicking a TOC item scrolls to heading without changing the doc hash
      Array.prototype.forEach.call(toc.querySelectorAll(".ds-sub"), function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          var el = document.getElementById(link.getAttribute("data-id"));
          if (el) { window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior: "smooth" }); }
          if (window.innerWidth <= 860) {
            sideEl.classList.add("collapsed");
            var mb = $("menu-btn"); if (mb) { mb.setAttribute("aria-expanded", "false"); mb.innerHTML = "☰ Menu"; }
          }
        });
      });
    }

    /* ---- home (index) view ---- */
    function renderHome() {
      buildSidebar(null);
      var html = '<p class="docs-kicker">Reference</p><h1 class="docs-h1">Documentation</h1>';
      html += '<p class="docs-lede">Everything about ai-jury, rendered live from the repository\u2019s <code>docs/</code>. Pick a topic.</p>';
      html += '<div class="docs-block"><h2>Documentation</h2><div class="dh-grid">'
        + '<a class="dh-card" href="coverage.html"><span class="dh-t">Test coverage</span><span class="dh-f mono">live gauge + per-file report</span></a>'
        + '<a class="dh-card" href="https://github.com/' + OWNER + "/" + REPO + '/blob/' + BRANCH + '/README.md"><span class="dh-t">README</span><span class="dh-f mono">on GitHub</span></a>'
        + "</div></div>";
      GROUPS.forEach(function (g) {
        html += '<div class="docs-block"><h2>' + g.title + "</h2><div class=\"dh-grid\">";
        g.items.forEach(function (it) {
          html += '<a class="dh-card" href="#' + it.slug + '"><span class="dh-t">' + it.title + '</span><span class="dh-f mono">docs/' + it.file + "</span></a>";
        });
        html += "</div></div>";
      });
      html += '<div class="docs-block"><h2>More</h2><div class="dh-grid">'
        + '<a class="dh-card" href="coverage.html"><span class="dh-t">Test coverage</span><span class="dh-f mono">live gauge + report</span></a>'
        + '<a class="dh-card" href="https://github.com/' + OWNER + "/" + REPO + '/blob/' + BRANCH + '/README.md"><span class="dh-t">README</span><span class="dh-f mono">on GitHub</span></a>'
        + "</div></div>";
      contentEl.innerHTML = html;
      document.title = "Documentation — ai-jury";
      window.scrollTo(0, 0);
    }

    /* ---- doc view ---- */
    function renderDoc(slug) {
      var item = BY_SLUG[slug];
      if (!item) { renderHome(); return; }
      buildSidebar(slug);
      contentEl.innerHTML = '<div class="doc-loading"><div class="doc-spinner"></div>Loading ' + item.title + "…</div>";
      window.scrollTo(0, 0);
      fetch(RAW_DOCS + item.file, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (md) {
          var raw = marked.parse(md, { gfm: true, breaks: false });
          var clean = window.DOMPurify ? DOMPurify.sanitize(raw, { ADD_ATTR: ["target"] }) : raw;
          var wrap = document.createElement("div");
          wrap.className = "md-body";
          wrap.innerHTML = clean;
          // meta row
          var meta = document.createElement("div");
          meta.className = "doc-meta";
          meta.innerHTML = '<span class="doc-source">docs/' + item.file + '</span>'
            + '<a class="doc-edit" href="' + BLOB_ROOT + "docs/" + item.file + '" target="_blank" rel="noopener">View source on GitHub →</a>';
          rewrite(wrap);
          // syntax highlight code blocks
          if (window.hljs) {
            Array.prototype.forEach.call(wrap.querySelectorAll("pre code"), function (block) {
              try { hljs.highlightElement(block); } catch (e) {}
            });
          }
          contentEl.innerHTML = "";
          contentEl.appendChild(meta);
          contentEl.appendChild(wrap);
          buildTOC(wrap);
          document.title = item.title + " — ai-jury";
          // jump to in-page anchor if present (slug#anchor not used; we keep simple)
        })
        .catch(function (err) {
          contentEl.innerHTML = '<div class="doc-error"><p><strong>Couldn\u2019t load this doc.</strong></p><p class="mono">' + (err && err.message ? err.message : "fetch failed") + '</p><p><a href="' + BLOB_ROOT + "docs/" + item.file + '" target="_blank" rel="noopener">Read it on GitHub →</a></p></div>';
        });
    }

    function route() {
      var slug = (location.hash || "").replace(/^#/, "").trim();
      if (!slug) { renderHome(); }
      else { renderDoc(slug); }
      // collapse mobile menu after navigation
      if (window.innerWidth <= 860) {
        sideEl.classList.add("collapsed");
        var mb = $("menu-btn"); if (mb) { mb.setAttribute("aria-expanded", "false"); mb.innerHTML = "☰ Menu"; var bar = mb.closest(".docs-mobilebar"); if (bar) bar.classList.remove("open"); }
      }
    }
    window.addEventListener("hashchange", route);
    route();
  })();
  </script>
