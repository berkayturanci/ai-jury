name: Feature Request
description: Suggest an improvement for agent-review-council
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What behavior would you like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This request belongs in the reusable package rather than a downstream project wrapper.
          required: true
