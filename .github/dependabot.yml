version: 2
updates:
  # Keep pinned GitHub Actions SHAs current (CI, CodeQL, Scorecard, publish).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "area:ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Track Python tooling/build dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    groups:
      python-tooling:
        patterns:
          - "*"
