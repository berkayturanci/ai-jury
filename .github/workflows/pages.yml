name: Deploy website (GitHub Pages)

on:
  # Deploy on any push to main so the published coverage report/badge stay
  # current with the code, plus on-demand.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one active deployment; cancel obsolete queued builds when a new commit lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # Build a browsable HTML coverage report + a self-hosted shields-endpoint
      # badge, both published as part of the site (no external service).
      - name: Generate coverage report + badge
        run: |
          timeout 120 python -m pip install --upgrade pip
          timeout 300 python -m pip install -e ".[dev]"
          python -m coverage run -m unittest discover -s tests
          python -m coverage html -d website/coverage
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          # Keep two decimals so the badge reflects the true figure (e.g. 99.95%)
          # instead of rounding 99.95 up to a misleading "100%". `:g` trims a
          # trailing ".0" so a clean 100 still shows as "100%", not "100.0%".
          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2)
          color = ("brightgreen" if pct >= 90 else "green" if pct >= 80
                   else "yellowgreen" if pct >= 70 else "yellow" if pct >= 60 else "red")
          msg = f"{pct:g}%"
          json.dump(
              {"schemaVersion": 1, "label": "coverage", "message": msg, "color": color},
              open("website/coverage-badge.json", "w"),
          )
          print(f"coverage badge: {msg} ({color})")
          PY
      # README advertises `curl -fsSL https://ai-jury.dev/install.sh | sh`, but
      # install.sh lives at the repo root while the artifact is built from
      # website/, so the documented one-liner 404s until it is copied in.
      # Copied rather than moved: the repo root stays the single source of truth.
      - name: Stage the standalone installer
        run: cp install.sh website/install.sh
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      # Tell IndexNow-participating engines (Bing — and through Bing, ChatGPT and
      # Copilot search — plus Yandex, Seznam, Naver) that the site changed,
      # instead of waiting to be crawled. Runs *after* the deploy so we never
      # announce content that is not live yet, and never fails a good deploy.
      #
      # The key is public by design: the engine fetches it from keyLocation to
      # prove we control the host, so it is committed rather than a secret.
      # Cloudflare's Crawler Hints would do this for us, but only for proxied
      # traffic — the apex is DNS-only, so Cloudflare never sees it.
      - name: Notify IndexNow
        continue-on-error: true
        # Bounded by the wrapper, not by `urlopen(timeout=30)` alone: that is a
        # per-socket-operation timeout, so an endpoint that dribbles a byte
        # inside every window keeps this step alive indefinitely. The step is
        # `continue-on-error`, which means a hang here costs the deploy nothing
        # but the wall clock — and that is exactly the kind of stall nobody goes
        # looking for.
        run: |
          timeout 60 python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET

          KEY = "011e96787808013452d77fdb5bc186215332078a0bd6bde72d6d6f103e24f19c"
          HOST = "ai-jury.dev"
          NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

          root = ET.parse("website/sitemap.xml").getroot()
          urls = [e.text.strip() for e in root.iter(NS + "loc") if e.text]
          if not urls:
              raise SystemExit("sitemap listed no URLs - nothing to submit")

          body = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f"IndexNow: HTTP {r.status} for {len(urls)} URL(s)")
          PY
