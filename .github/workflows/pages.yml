name: Deploy website (GitHub Pages)

on:
  # Deploy on any push to main so the published coverage report/badge stay
  # current with the code, plus on-demand.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4.2.2 (pinned 2026-05-30)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (updated 2026-05-31)
        with:
          python-version: "3.13"
      # Build a browsable HTML coverage report + a self-hosted shields-endpoint
      # badge, both published as part of the site (no external service).
      - name: Generate coverage report + badge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m coverage run -m unittest discover -s tests
          python -m coverage html -d website/coverage
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          # Keep two decimals so the badge reflects the true figure (e.g. 99.95%)
          # instead of rounding 99.95 up to a misleading "100%". `:g` trims a
          # trailing ".0" so a clean 100 still shows as "100%", not "100.0%".
          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2)
          color = ("brightgreen" if pct >= 90 else "green" if pct >= 80
                   else "yellowgreen" if pct >= 70 else "yellow" if pct >= 60 else "red")
          msg = f"{pct:g}%"
          json.dump(
              {"schemaVersion": 1, "label": "coverage", "message": msg, "color": color},
              open("website/coverage-badge.json", "w"),
          )
          print(f"coverage badge: {msg} ({color})")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v5 (pinned 2026-05-31)
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v3 (pinned 2026-05-31)
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v4 (pinned 2026-05-31)
