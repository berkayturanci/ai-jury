name: keel-ship

# The consumer copy of keel's own keel-ship workflow (#602). ai-jury declared
# `tier3_globs` — adapters, privilege, redaction, injection, config — but nothing
# read that declaration at merge time, so 16 consecutive PRs merged with zero
# review verdicts. The `gates: [build, lint]` line was never the gap: keel's own
# config says exactly the same. There was no workflow to run the gate.
#
# keel is installed **pinned**, and from `keel-workflow`. The PyPI name `keel` is
# an unrelated package at 0.1 — installing that would give this job someone
# else's code, or no `keel` command at all. The version is bumped deliberately
# rather than floated, so a keel release cannot change this repo's merge
# contract without a reviewed diff here. The pin is for reproducibility of
# the gate, not avoidance of new rules: `.github/requirements/keel-tools.txt`
# holds the same pin so Dependabot proposes the next bump.

on:
  pull_request:
  # A verdict is the event this gate waits for, so it must re-evaluate when one
  # arrives. Without this the published check stays incomplete forever: the only
  # other retrigger is a new commit, which changes the head SHA and invalidates
  # the very verdicts that would let it pass.
  #
  # `issue_comment` specifically, because that is what keel posts:
  # `keel post-comment` calls POST /issues/{n}/comments. Formal reviews and
  # inline review comments are not what a verdict arrives as, so subscribing to
  # `pull_request_review*` instead — which reads like the tidier choice — would
  # fire exactly never.
  #
  # It does fire for comments on plain issues too; the jobs below filter for a
  # pull request. `issue_comment` also always runs the workflow from the default
  # branch and checks out that branch rather than the PR head, so no
  # contributor-authored code executes on this path.
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to assess (optional)"
        required: false
      deferral:
        description: "Optional evidence deferral id, kind, or all"
        required: false

# One evaluation per pull request *per event* — the event name is part of the
# group on purpose.
#
# A single group across every trigger did more than serialize. `keel review
# --live` posts its verdict comments seconds after the push that started the
# assessment, so the `issue_comment` run landed in the same group as the
# still-running `pull_request` run and cancelled it. A cancelled run's job
# check-runs (`keel ship (assessment)`, `keel evidence (verify)`) stay
# `cancelled` on that head and cannot be removed; GitHub then reports the pull
# request as UNSTABLE and `keel merge` refuses on "CI failing" with every
# required check green. The standing workaround was `gh run rerun` on every
# pull request (berkayturanci/keel#1037; here #668, #670, #671, #672, #674).
#
# Cancelling *within* one event stays on. Usually the cancelled run belongs to a
# head SHA the newer run has already superseded — but not always: `reopened`, a
# `synchronize` fired by a base-branch update, and a force-push back to an
# already-assessed SHA all re-run `pull_request` on an unchanged head. What
# covers those is that whatever did the cancelling is a run of the *same* event
# on that same head, so it republishes both job check-runs under the same names,
# and both GitHub's branch protection and keel's own rollup dedupe
# (`cli._dedupe_rollup`) read the most recent check-run per name. The case that
# broke was a *different* event cancelling, which republishes nothing.
#
# The cost, paid knowingly: `keel review --live` posts three verdicts seconds
# apart, so two of those `issue_comment` runs are now cancelled inside their own
# group. That event always runs from the default branch, so those cancelled job
# check-runs land on the default branch's tip — visible in the UI, and read by
# nothing that gates a pull request.
#
# Splitting the groups does let a `pull_request` run and an `issue_comment` run
# overlap, which is the GET-then-PATCH race the shared group used to prevent.
# The check-runs API offers no compare-and-swap, so `publish_check` below cannot
# make a lost update impossible; what it does is shrink the window from the
# whole install-and-verify run to the single round trip between reading the
# published stamp and writing over it.
concurrency:
  group: keel-ship-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  ship:
    name: keel ship (assessment)
    # Not on a comment: this job assesses the diff, and a comment does not change
    # it. Only the evidence gate needs to re-read the PR when a verdict lands.
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    # This workflow writes the check-run a merge is gated on, and it runs on
    # every pull request. Under GitHub's six-hour default a stalled request here
    # leaves that check *open* rather than failing it — a merge blocked with
    # nothing reported, which is worse than red. Each command below carries its
    # own bound; this is the backstop, and the ceiling test in
    # `tests/test_publish_release_chain.py` checks it clears their sum (#697).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # full history so keel can diff against the base branch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Same pin as .github/requirements/keel-tools.txt — reproducibility of
      # the gate, not avoidance of new rules.
      - name: Install keel (pinned)
        run: timeout 120 python -m pip install --upgrade pip && timeout 300 pip install "keel-workflow==1.21.0"
      - name: Make base branch available locally
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: timeout 60 git fetch --no-tags origin "$BASE:$BASE" || true
      - name: Run keel ship (informational)
        id: ship
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set +e
          ARGS=(.keel/project.yaml --root .)
          if [ -n "$PR" ]; then
            ARGS+=(--pr "$PR")
          fi
          timeout 600 keel ship "${ARGS[@]}" | tee ship.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo '### 🚢 keel ship'; echo '```'; cat ship.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment assessment on the PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.ship.outputs.code }}
        run: |
          {
            echo '### 🚢 keel ship'
            echo
            echo '```'
            cat ship.txt
            echo '```'
            echo
            echo "_decision exit code: ${CODE} (0 = not BLOCK). Informational — not a required gate._"
          } > body.md
          timeout 60 gh pr comment "$PR" --body-file body.md

  evidence:
    # Deliberately NOT "keel evidence (required)". Actions names this job's own
    # check after the job, and that check is driven by the exit code — it can only
    # ever say "the job ran". The gating signal is the check-run the step below
    # publishes under that name, and two same-named checks on one commit would be
    # indistinguishable to branch protection, which matches by name.
    name: keel evidence (verify)
    runs-on: ubuntu-latest
    # See `ship` above: this is the job that publishes the gating check-run, so a
    # hang here is a merge blocked with nothing reported.
    timeout-minutes: 25
    # Ordered after `ship` on purpose. Arming falls through to the ship-assessment
    # comment for any branch outside evidence._SHIP_BRANCH_RE, and that comment is
    # written by the `ship` job — running the two in parallel let this gate read the
    # PR before the comment existed and pass having checked nothing.
    needs: ship
    # Written on the event name, not on `github.event.inputs.pr`. On any event
    # without a `workflow_dispatch` payload that expression is `null`, and
    # GitHub coerces both `null` and `''` to 0 — so `null != ''` is **false**
    # and this job would be silently skipped on every event but `pull_request`.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '')
      ) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Same pin as .github/requirements/keel-tools.txt — reproducibility of
      # the gate, not avoidance of new rules.
      - name: Install keel (pinned)
        run: timeout 120 python -m pip install --upgrade pip && timeout 300 pip install "keel-workflow==1.21.0"
      - name: Verify posted ship evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
          DEFERRAL: ${{ github.event.inputs.deferral }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Not `head.repo.fork`, which means "the head repo is itself a fork of
          # something" — true for every same-repo PR in a downstream fork. What
          # matters is whether the head lives somewhere else.
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
          CHECK_NAME: keel evidence (required)
        run: |
          # --phase pre-merge: the closure comments are an s11 artifact, posted after
          # the merge this gate authorizes, so requiring them here is unsatisfiable.
          # --require-armed: an unarmed gate must not report success, or a green check
          # cannot be told apart from one that never evaluated anything.
          # --no-jury: #602's decision. keel auto-enables a *gating* jury verdict at
          # tier-3, and this repo's jury runs against real vendor APIs — a paid run
          # per PR is not the cost posture, and a gate nobody can afford to satisfy
          # is a gate that gets waived. It drops only the jury verdict: tier-3 still
          # requires three distinct reviewer verdicts, which is where the review
          # value is. Revisit if tier-3 changes warrant it.
          ARGS=(.keel/project.yaml --root . --pr "$PR" --phase pre-merge --require-armed --no-jury)
          if [ -n "$DEFERRAL" ]; then
            ARGS+=(--deferral "$DEFERRAL")
          fi

          # On workflow_dispatch there is no pull_request payload. Falling back to
          # $GITHUB_SHA would stamp the verdict for PR $PR onto whatever ref the run
          # was dispatched from — normally the default branch — and check-runs cannot
          # be deleted. Resolve the PR's real head instead.
          HEAD_SHA="$PR_HEAD_SHA"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA=$(timeout 60 gh pr view "$PR" --json headRefOid -q .headRefOid)
          fi

          # Stamped immediately before the read and published as the check-run's
          # `external_id`, so two runs over one head can be ordered by *when they
          # read the pull request*. Before the read, never after: a run that
          # started before a verdict was posted can still finish after the run
          # that saw it, and a completion time would rank that stale answer first.
          #
          # Nanoseconds, not seconds: two runs racing over one head are seconds
          # apart at most, and whole seconds leave the common case — both reads
          # inside the same second — unordered, which under a strict `-gt` means
          # neither declines. 19 digits stays digit-only for the guard below and
          # inside bash's signed 64-bit arithmetic until the year 2262.
          EVALUATED_AT=$(date -u +%s%N)

          set +e
          # 124 on a timeout falls through to the `*)` arm below, which publishes
          # a `failure` conclusion. That is the point: a bounded call that gives
          # up reports a verdict, where an unbounded one leaves the gating check
          # incomplete and the pull request unmergeable with nothing to read.
          timeout 300 keel evidence-verify "${ARGS[@]}"
          RC=$?
          set -e

          # Upsert, never blind POST. The check-runs API has no upsert on
          # (name, head_sha): every run would stack another check under the gating
          # name, at least one of them permanently incomplete. Branch protection
          # matches by name, so which of several same-named checks it reads is
          # exactly the ambiguity the job rename above exists to avoid.
          publish_check() {
            local status="$1" conclusion="$2" title="$3" summary="$4"
            local body=(-f "status=${status}"
                        -f "external_id=${EVALUATED_AT}"
                        -f "output[title]=${title}"
                        -f "output[summary]=${summary}")
            if [ -n "$conclusion" ]; then
              body+=(-f "conclusion=${conclusion}")
            fi
            local existing existing_id existing_stamp
            # --method GET is required: `-f` alone switches gh to POST, which
            # 404s on this endpoint and would make every upsert look like "no
            # existing run" — quietly restoring the stacking this replaces.
            #
            # `max_by`, not `.check_runs[0]`: the list endpoint's order is not
            # documented as newest-first, and a head that already carries more
            # than one run under the gating name — the stacking this upsert
            # exists to prevent, which a pre-guard workflow could have left
            # behind — would otherwise have its *stamp* read off an arbitrary
            # row, and an old stamp there disarms the guard. An unparseable or
            # absent stamp sorts as 0, so a stamped run always outranks one.
            #
            # `select(.)` keeps "no check-run yet" as empty output: `max_by` over
            # an empty list is null, which would otherwise interpolate to a
            # single space — not empty, and parsed as an existing run with no id.
            existing=$(timeout 60 gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              -f "check_name=${CHECK_NAME}" \
              --jq '.check_runs | map(select(.id)) | max_by(.external_id | tonumber? // 0) | select(.) | "\(.id) \(.external_id // "")"' 2>/dev/null) || existing=""
            existing_id=""
            existing_stamp=""
            if [ -n "$existing" ]; then
              read -r existing_id existing_stamp <<<"$existing"
            fi

            # Concurrency is now per event (see the top of this file), so a
            # `pull_request` run and an `issue_comment` run can be in flight over
            # one head at the same time. Whoever read the pull request *last* holds
            # the current verdict, and an earlier evaluation that happens to finish
            # second must not put its answer back — that is the regression the
            # shared concurrency group used to prevent by cancelling, at the cost
            # of the cancelled check-runs this change is about.
            #
            # Numeric-only comparison: a check-run published before this guard
            # existed carries no `external_id` and is simply overwritten, which is
            # the safe direction (this run has read the newer state).
            #
            # Returns 3, not 0: "a newer run holds the check" and "this run
            # published its verdict" are different outcomes, and the caller must
            # not replay *this* run's exit code over the newer one — see the
            # dispatch below.
            if [ -n "$existing_stamp" ] && [ -z "${existing_stamp//[0-9]/}" ] \
              && [ "$existing_stamp" -gt "$EVALUATED_AT" ]; then
              echo "::notice title=Newer evidence verdict kept::A run that read this pull request later (${existing_stamp} > ${EVALUATED_AT}) already published \"$CHECK_NAME\" for ${HEAD_SHA}; this older evaluation is not overwriting it."
              return 3
            fi

            if [ -n "$existing_id" ]; then
              timeout 60 gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${existing_id}" \
                "${body[@]}" >/dev/null
            else
              timeout 60 gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
                -f "name=${CHECK_NAME}" -f "head_sha=${HEAD_SHA}" "${body[@]}" >/dev/null
            fi
          }

          # One verdict, three shapes. Kept as assignments rather than three copies of
          # the publish call so the reporting path is single and the arms differ only
          # in what they report.
          #
          # FALLBACK_EXIT is what this job exits with when the check-run could not be
          # published at all. On a pull request from a fork the token is read-only
          # whatever `permissions:` declares, so the gating check cannot be created —
          # and exiting 1 unconditionally there would leave every fork contribution
          # red with no route forward, including one whose evidence passed. The job's
          # own exit code becomes the fallback channel instead: green when the
          # evidence verified, red otherwise. Never green-while-unverified.
          case "$RC" in
            0)
              STATUS=completed; CONCLUSION=success; FALLBACK_EXIT=0
              TITLE="Evidence verified"
              SUMMARY="All required evidence for the pre-merge phase is present and pinned to \`$HEAD_SHA\`."
              echo "Evidence verification passed."
              ;;
            2)
              STATUS=in_progress; CONCLUSION=""; FALLBACK_EXIT=1
              TITLE="Waiting for review evidence"
              SUMMARY="Pre-verdict state: required reviewer verdicts are not posted yet. This check stays incomplete, which blocks a merge, until the evidence resolves."
              echo "::notice title=Waiting for review evidence::Evidence gate is in pre-verdict state (waiting for review evidence). Merge remains blocked until all required verdicts pass."
              {
                echo "### ⏳ keel evidence (waiting)"
                echo
                echo "Evidence gate is in pre-verdict state — waiting for required reviewer verdicts."
                echo "_Merge remains blocked until required evidence is posted and verified._"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              STATUS=completed; CONCLUSION=failure; FALLBACK_EXIT=1
              TITLE="Evidence verification failed"
              SUMMARY="Explicit evidence violation: a closure comment that does not match the ledger record, a missing attribution label, or an unarmed gate. Run \`keel evidence-verify\` locally for the itemised report."
              echo "::error title=Evidence verification failed::Explicit evidence violation or finding detected."
              ;;
          esac

          set +e
          publish_check "$STATUS" "$CONCLUSION" "$TITLE" "$SUMMARY"
          PUBLISHED=$?
          set -e

          # 3 = declined, because a newer evaluation already holds the check-run.
          # That verdict is the authoritative one and this run's RC is stale, so
          # it is not replayed — exiting 1 here on a stale violation would mark
          # *this* job FAILURE on the live head, and `cli._ci_rollup_state` scores
          # FAILURE exactly like CANCELLED, so `keel merge` would refuse on "CI
          # failing" all over again. The state can genuinely differ between two
          # reads: this workflow subscribes to comment `edited` as well as
          # `created`, so an amended verdict flips the answer between them.
          if [ "$PUBLISHED" -eq 3 ]; then
            exit 0
          fi

          if [ "$PUBLISHED" -eq 0 ]; then
            # The named check carries the verdict, so this job reports only that
            # the verification ran — 0 while the gate is waiting, because the
            # incomplete check is what blocks. A hard evidence violation still
            # fails the job: that is not a state anything is waiting on.
            if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
              exit 1
            fi
            exit 0
          fi

          if [ "$IS_FORK" = "true" ]; then
            echo "::warning title=Evidence check-run unavailable::A pull request from a fork gets a read-only token, so \"$CHECK_NAME\" cannot be published. This job's exit code carries the verdict instead; to publish it, use Run workflow (workflow_dispatch) from the base repository with this PR number — Re-run all jobs replays the same read-only token."
            exit "$FALLBACK_EXIT"
          fi
          echo "::error title=Could not publish the evidence check-run::Reporting the verdict to GitHub failed, so this step fails rather than leaving the gate unreported."
          exit 1
