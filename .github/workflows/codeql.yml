name: CodeQL

on:
  # Per-commit security analysis (the repository is public, so hosted minutes are
  # free), plus a weekly re-scan to catch newly disclosed query patterns and an
  # on-demand trigger.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly re-scan so newly disclosed query patterns are caught even without a push.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    # The analysis is entirely `uses:` steps, so there is no shell here to bound
    # and this ceiling is the only bound the job has (#697). CodeQL downloads its
    # bundle and uploads a SARIF; without a ceiling either of those stalls under
    # GitHub's six-hour default on every push and pull request.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: python
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:python"
