name: CodeQL

on:
  # Hosted-only analysis. Runs on a weekly schedule (and on demand) rather than
  # per-push/PR: GitHub-hosted jobs currently fail to start under the account's
  # billing/spending limit, so per-commit triggers would paint every commit red
  # without analyzing anything. The weekly scan still catches newly disclosed
  # query patterns once hosted minutes are available. Re-add `push`/`pull_request`
  # to restore per-commit scanning when billing is restored.
  workflow_dispatch:
  schedule:
    # Weekly re-scan so newly disclosed query patterns are caught even without a push.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (updated 2026-05-31)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0 (updated 2026-05-31)
        with:
          languages: python
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0 (updated 2026-05-31)
        with:
          category: "/language:python"
