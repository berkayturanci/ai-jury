name: Local CI (self-hosted)

# Authoritative per-push/PR test signal for this project. Runs the stdlib-only
# unit tests, the mock CLI smoke test, and the coverage gate on a maintainer-run
# self-hosted macOS runner — free, fast, and not subject to GitHub-hosted billing.
#
# The hosted cross-OS / multi-Python matrix lives in ci.yml and is MANUAL-ONLY
# (workflow_dispatch) while GitHub-hosted jobs fail to start under the account's
# billing/spending limit; CodeQL and Scorecard run on a weekly schedule for the
# same reason. See docs/architecture.md ("CI & runners") for the policy and how
# to restore the hosted matrix once hosted minutes are available.
#
# Requires the self-hosted runner (labels: self-hosted, macOS, ARM64) to be
# online; if it is offline, these jobs queue until it returns.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests & smoke (self-hosted macOS)
    runs-on: [self-hosted, macos, arm64]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (updated 2026-05-31)
      - name: Show Python
        run: python3 --version
      - name: Run offline (mock) unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke-test the CLI in mock mode
        run: |
          python3 -m agent_review_council --mock --diff-file examples/sample.diff -q | tee report.md
          grep -q "Agent Review Council" report.md
          grep -q "Chair verdict" report.md

  coverage:
    name: Coverage gate (self-hosted)
    # The authoritative coverage gate, moved here from the hosted ci.yml so the
    # minimum-coverage bar is actually enforced per push/PR. Threshold
    # (fail_under) lives in pyproject.toml under [tool.coverage.report].
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (updated 2026-05-31)
      - name: Install package with dev tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
      - name: Run tests under coverage
        run: python3 -m coverage run -m unittest discover -s tests
      - name: Enforce minimum coverage
        run: python3 -m coverage report
