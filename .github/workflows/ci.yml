name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned 2026-05-30)
      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f  # v5.1.1 (pinned 2026-05-30)
        with:
          python-version: "3.13"
      - name: Run offline (mock) test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI in mock mode
        run: |
          python -m agent_review_council --mock --diff-file examples/sample.diff -q \
            | tee /tmp/report.md
          grep -q "Agent Review Council" /tmp/report.md
          grep -q "Chair verdict" /tmp/report.md
        env:
          PYTHONPATH: src
