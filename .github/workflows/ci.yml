name: CI

# Hosted cross-OS / multi-Python matrix. The self-hosted `Local CI (self-hosted)`
# workflow is the authoritative per-push/PR signal (see docs/architecture.md);
# this hosted matrix is MANUAL-ONLY (`workflow_dispatch`) because GitHub-hosted
# jobs currently fail to start under the account's billing/spending limit, which
# would otherwise paint every commit red without running. Trigger it from the
# Actions tab to recover full ubuntu/macOS/windows × Python 3.11-3.13 coverage
# once hosted minutes are available again; re-add `push`/`pull_request` here to
# make it automatic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python-version coverage on Linux; the latest supported Python on
        # macOS and Windows to prove cross-OS CLI/subprocess behavior while keeping
        # the matrix small and cheap. See docs/architecture.md for OS notes.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (updated 2026-05-31)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (updated 2026-05-31)
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run offline (mock) unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI in mock mode
        # bash is available on all three runners (git-bash on Windows), keeping the
        # smoke assertions identical across operating systems.
        shell: bash
        run: |
          python -m agent_review_council --mock --diff-file examples/sample.diff -q | tee report.md
          grep -q "Agent Review Council" report.md
          grep -q "Chair verdict" report.md

  coverage:
    name: Coverage gate
    # One dedicated job on a single OS/Python keeps the matrix cheap and avoids
    # cross-OS path noise. The threshold (fail_under) lives in pyproject.toml
    # under [tool.coverage.report].
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (updated 2026-05-31)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (updated 2026-05-31)
        with:
          python-version: "3.13"
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests under coverage
        run: python -m coverage run -m unittest discover -s tests
      - name: Enforce minimum coverage
        run: python -m coverage report
      - name: Generate coverage XML
        if: always()
        run: python -m coverage xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
