name: Publish to PyPI and GitHub Release

on:
  push:
    tags:
      - "v*"

# Least-privilege default for the whole workflow; the job below elevates only the
# scopes it needs (OpenSSF Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build, Publish to PyPI, and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # PyPI trusted publishing (OIDC) + provenance attestation
      contents: write       # create the GitHub Release and upload assets
      pull-requests: write # open the formula follow-up when main refuses a push (#638)
      attestations: write   # build-provenance attestations (issue #25)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Hard guard against version drift across the release-version sources
      # of truth (issue #284): the tag we're publishing under (`v1.2.3` →
      # `1.2.3`), pyproject.toml [project] version, and both plugin
      # manifests' versions must all be identical. A mismatch used to ship a
      # stale plugin manifest (see #283 — manifest sat at 0.1.0 across
      # v1.0.0 → v1.2.0); the Codex manifest added in #437 is checked here
      # too so it can't drift the same way. Fail loudly here instead.
      - name: Verify tag matches pyproject + plugin manifests
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          plugin_version="$(python -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          codex_plugin_version="$(python -c 'import json;print(json.load(open(".codex-plugin/plugin.json"))["version"])')"
          echo "tag=$tag_version  pyproject=$pyproject_version  plugin=$plugin_version  codex_plugin=$codex_plugin_version"
          if [ "$tag_version" != "$pyproject_version" ] || [ "$tag_version" != "$plugin_version" ] || [ "$tag_version" != "$codex_plugin_version" ]; then
            echo "::error::Version drift — tag ($tag_version) must match pyproject ($pyproject_version), plugin.json ($plugin_version), and codex-plugin/plugin.json ($codex_plugin_version)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package distributions
        run: python -m build --sdist --wheel --outdir dist/

      # SBOM (issue #25): a CycloneDX software bill of materials for the built
      # package. We install ONLY the freshly-built wheel (--no-deps) into a
      # pip-less venv, then point `cyclonedx-py environment` at that isolated
      # venv. The result reflects the PACKAGE and its runtime dependencies (none
      # — stdlib-only) and nothing else: the venv has no pip/setuptools and the
      # runner's own packages are out of scope (#254: running `environment`
      # against the build env captured cyclonedx-bom + preinstalled runner
      # packages, misrepresenting a zero-dependency project; `pyproject` is not a
      # valid cyclonedx-py subcommand). `--pyproject` enriches the root component
      # with the project metadata. Written into release/ (NOT dist/) so the PyPI
      # upload sees only the wheel + sdist — twine rejects non-distribution files
      # in the upload dir. The SBOM still ships with the GitHub Release.
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          mkdir -p release
          python -m venv --without-pip sbom-venv
          python -m pip --python sbom-venv/bin/python install --no-deps dist/*.whl
          cyclonedx-py environment sbom-venv \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-format JSON \
            --output-file release/sbom.cdx.json

      # Checksums (issue #25): a single SHA256SUMS over every release artifact so
      # downloaders can verify integrity with `sha256sum -c SHA256SUMS`. Staged in
      # release/ next to the dists (kept out of dist/ for the same reason as above).
      - name: Generate checksums
        run: |
          cp dist/*.whl dist/*.tar.gz release/
          cd release
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # Build provenance (issue #25): cryptographic attestation binding the
      # artifacts to this workflow run, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # PyPI trusted publishing (issue #25): OIDC, no long-lived API token. dist/
      # holds only the wheel + sdist (SBOM/checksums live in release/), so the
      # upload isn't tripped by non-distribution files. NOT continue-on-error: a
      # failed publish must fail the release loudly. `skip-existing` keeps re-runs
      # idempotent. Requires a one-time trusted-publisher config on PyPI for this
      # repo+workflow (see docs/releasing.md).
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            release/*.whl
            release/*.tar.gz
            release/sbom.cdx.json
            release/SHA256SUMS
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Homebrew formula sync (issue #527): update Formula/ai-jury.rb with the
      # newly-published release tarball checksum and commit back to main.
      - name: Update in-repo Homebrew Formula
        env:
          # `gh pr create` below; scoped to this repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"

          # Both values come from PyPI, neither is constructed. The previous
          # version guessed the url as /packages/source/a/ai_jury/… — a layout
          # PyPI no longer serves, so it 404'd — and took the digest from the
          # locally built sdist, which is not byte-identical to the uploaded one.
          # Every release produced an uninstallable formula that way (#562).
          # PyPI is the only authority for either: the path is content-addressed
          # and cannot be derived, and the digest has to belong to the artifact
          # brew will download.
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL "https://pypi.org/pypi/ai-jury/${tag_version}/json" -o /tmp/pypi.json && break
            echo "PyPI has not indexed ${tag_version} yet (attempt ${attempt}); retrying…"
            sleep 10
          done

          read -r sdist_url sdist_sha <<EOF
          $(python3 -c "
          import json
          urls = json.load(open('/tmp/pypi.json'))['urls']
          sdist = next(f for f in urls if f['packagetype'] == 'sdist')
          print(sdist['url'], sdist['digests']['sha256'])")
          EOF

          sed -i.bak "s|url \".*\"|url \"${sdist_url}\"|" Formula/ai-jury.rb
          sed -i.bak "s|sha256 \".*\"|sha256 \"${sdist_sha}\"|" Formula/ai-jury.rb
          sed -i.bak "s|jury .*\", shell_output|jury ${tag_version}\", shell_output|" Formula/ai-jury.rb
          rm -f Formula/ai-jury.rb.bak

          # Prove it before publishing anywhere. A tap one release behind still
          # installs; a tap holding an uninstallable formula does not.
          curl -fsSL "$sdist_url" -o /tmp/sdist.tar.gz
          got="$(sha256sum /tmp/sdist.tar.gz | cut -d' ' -f1)"
          if [ "$got" != "$sdist_sha" ]; then
            echo "::error::formula sha256 does not match the artifact it points at"
            exit 1
          fi
          echo "formula verified against ${sdist_url}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ai-jury.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(homebrew): Update Formula/ai-jury.rb to v${tag_version} [skip ci]"
            # Branch protection refuses a direct push to main (10 required
            # checks), and the `|| true` that used to swallow that refusal is
            # why a stale digest shipped with 1.15.0 and the tap then refused
            # every sync for a day — in a different repository, hourly, long
            # after anyone was still watching the release.
            #
            # So the fix arrives the only way it can pass protection: as a pull
            # request, opened here rather than remembered by a human. The
            # sibling repo forgot exactly this follow-up for its own 1.19.1.
            branch="chore/formula-${tag_version}"
            if git push -f origin "HEAD:${branch}" 2>/tmp/push.err; then
              if gh pr create --base main --head "$branch" \
                   --title "chore(homebrew): Formula digest for v${tag_version}" \
                   --body "$(printf '%s\n' \
                     "Opened by the publish workflow: the sdist digest is only knowable" \
                     "once the release exists, so the formula in the repo is one release" \
                     "behind until this merges." \
                     "" \
                     "| | |" \
                     "|---|---|" \
                     "| url | \`${sdist_url}\` |" \
                     "| sha256 | \`${sdist_sha}\` |" \
                     "" \
                     "The tap syncs from \`main\`, so until this merges \`brew upgrade\`" \
                     "does not see v${tag_version}.")" 2>/tmp/pr.err; then
                echo "formula follow-up PR opened on ${branch}"
              else
                sed 's/^/  /' /tmp/pr.err
                echo "::notice::Branch ${branch} is pushed; a pull request for it already exists."
              fi
            else
              echo "::error title=Formula not committed::Could not push ${branch}:"
              sed 's/^/  /' /tmp/push.err
              # An `::error::` rather than a non-zero exit: PyPI and the GitHub
              # Release have already succeeded by this point, and failing here
              # would report a good release as broken. The hard stop is the
              # formula digest test in CI, which turns the next pull request red.
              {
                echo "### ⚠️ Homebrew formula not committed"
                echo
                echo "The digest was computed correctly but could not be pushed."
                echo "Set \`sha256\` in \`Formula/ai-jury.rb\` to \`${sdist_sha}\`,"
                echo "or \`brew upgrade\` will not see this release."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Publish the formula to the Homebrew tap
        # The repo's copy is not the copy brew installs — keel fixed its own
        # formula, went green, and users kept getting the broken one until the tap
        # was synced by hand (keel#787). So the tap must be updated, but *this*
        # step is no longer the only thing that can do it, and therefore no longer
        # fails the release.
        #
        # A workflow's GITHUB_TOKEN is scoped to its own repository, so pushing to
        # the tap needs a PAT. Rather than make every release depend on one being
        # present, the tap pulls: berkayturanci/homebrew-ai-jury runs a scheduled
        # workflow that fetches this formula, verifies its url and digest against
        # the artifact, and commits when they differ. Reading a public repo needs
        # no credential, and the token that writes the tap is the tap's own.
        #
        # This step stays as the *fast path*: with HOMEBREW_TAP_TOKEN set the tap
        # updates within seconds instead of within the schedule interval. Without
        # it the release completes and the tap catches up on its own, so the
        # failure mode is latency rather than a red release or a stale tap.
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: berkayturanci/homebrew-ai-jury
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — the tap will pick this up on its own schedule."
            exit 0
          fi
          gh api "repos/${TAP}/contents/Formula/ai-jury.rb" --jq .sha > .tap-sha || echo "" > .tap-sha
          gh api -X PUT "repos/${TAP}/contents/Formula/ai-jury.rb" \
            -f message="chore: sync formula for ${GITHUB_REF_NAME} (from ${GITHUB_REPOSITORY}@${GITHUB_SHA})" \
            -f content="$(base64 -w0 Formula/ai-jury.rb)" \
            $( [ -s .tap-sha ] && echo -f sha="$(cat .tap-sha)" )
          # A 200 from the push is not proof the tap serves the new bytes.
          gh api "repos/${TAP}/contents/Formula/ai-jury.rb" --jq .content | base64 -d > tap-formula.rb
          diff Formula/ai-jury.rb tap-formula.rb
