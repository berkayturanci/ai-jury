name: OpenSSF Scorecard

on:
  # Scorecard publishes results from the default branch; it cannot publish from
  # pull requests or forks, so it intentionally does not run on `pull_request`.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "18 4 * * 2"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and obtain a badge (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned 2026-05-30)
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3 (pinned 2026-05-31)
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF REST API so the README badge can resolve.
          publish_results: true
      - name: Upload results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (pinned 2026-05-31)
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57  # v3 (pinned 2026-05-31)
        with:
          sarif_file: results.sarif
