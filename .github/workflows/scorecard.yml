name: OpenSSF Scorecard

on:
  # Scorecard publishes results from the default branch; it cannot publish from
  # pull requests or forks, so it intentionally does not run on `pull_request`.
  # The repository is public, so hosted minutes are free: run on pushes to main
  # (to keep the score current), plus the weekly schedule and on-demand trigger.
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: "18 4 * * 2"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and obtain a badge (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (updated 2026-05-31)
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3 (pinned 2026-05-31)
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF REST API so the README badge can resolve.
          publish_results: true
      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (updated 2026-05-31)
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0 (updated 2026-05-31)
        with:
          sarif_file: results.sarif
