name: PR description lint

# Enforce that every PR carries a real description AND declares the issues it
# touches (#271). A GitHub PR template only pre-fills the body — it cannot stop
# a PR from being opened/merged empty (which happened on #270). This check makes
# that a hard, required signal. Pure stdlib Python, no dependencies; reads the PR
# body from the event payload via an env var (never interpolated into the shell,
# to avoid script injection from PR text).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  description:
    name: PR has a real description + linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          body = os.environ.get("PR_BODY", "") or ""

          # Ignore the template's HTML guidance comments before measuring.
          stripped = re.sub(r"<!--.*?-->", "", body, flags=re.S)

          # "Prose" = non-blank lines that are not markdown headings and not bare
          # checkbox items (the template's checklists don't count as a summary).
          prose = []
          for line in stripped.splitlines():
              s = line.strip()
              if not s or s.startswith("#"):
                  continue
              if re.match(r"^[-*]\s*\[[ xX]\]", s):   # "- [ ] ..." checklist row
                  continue
              prose.append(s)
          summary = " ".join(prose).strip()

          # Issue reference: a real "#<number>", or the explicit "no issue" opt-out.
          has_ref = bool(re.search(r"#\d+", body)) or bool(
              re.search(r"\bno[ -]?issue\b", body, re.I)
          )

          MIN_PROSE = 20
          errors = []
          if len(summary) < MIN_PROSE:
              errors.append(
                  f"description is empty or too short — write a real summary "
                  f"(>= {MIN_PROSE} chars of prose, excluding headings/checklists)."
              )
          if not has_ref:
              errors.append(
                  "no linked issue — add 'Closes #N' (or 'Relates to #N'), "
                  "or write 'no issue' if this PR genuinely touches none."
              )

          if errors:
              print("PR description lint failed:")
              for e in errors:
                  print(f"  - {e}")
              print(
                  "\nEdit the PR description to fix these. See the PR template's "
                  "'Summary' and 'Related issues' sections."
              )
              sys.exit(1)
          print("PR description OK: has a summary and an issue reference.")
          PY
