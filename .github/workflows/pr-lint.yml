name: PR description lint

# Enforce that every PR carries a real description AND declares the issues it
# touches (#271). A GitHub PR template only pre-fills the body — it cannot stop
# a PR being opened/merged empty (which happened on #270). This check makes that
# a hard, required signal. Pure stdlib Python, no dependencies; reads the PR body
# from the event payload via an env var (never interpolated into the shell, to
# avoid script injection from PR text).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  description:
    name: PR has a real description + linked issue
    runs-on: ubuntu-latest
    # Nothing in this job reaches the network — the check reads the PR body out
    # of `env:` and the template off the checkout — so the ceiling is the whole
    # bound. It runs on every pull request, and a required check that hangs
    # blocks a merge without ever reporting.
    timeout-minutes: 10
    steps:
      # Checkout so the check can read the PR template and discount any line the
      # author left verbatim (placeholders, checklists) — comparing against the
      # template is more robust than hard-coding placeholder strings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib

          def strip_comments(text):
              return re.sub(r"<!--.*?-->", "", text, flags=re.S)

          body = os.environ.get("PR_BODY", "") or ""
          # Strip the template's HTML guidance FIRST: the issue-reference and
          # opt-out checks must look at AUTHORED text only, otherwise the comment's
          # own "#N"/"no issue" guidance would satisfy them for every default PR.
          authored = strip_comments(body)

          # Lines the author left exactly as the template shipped them (the prose
          # placeholder, checklist rows, headings) don't count as a real summary.
          tpl = pathlib.Path(".github/pull_request_template.md")
          boilerplate = set()
          if tpl.exists():
              boilerplate = {
                  ln.strip()
                  for ln in strip_comments(tpl.read_text(encoding="utf-8")).splitlines()
                  if ln.strip()
              }

          prose = []
          for line in authored.splitlines():
              s = line.strip()
              if not s:
                  continue
              if re.match(r"#{1,6}\s", s):           # markdown heading (not "#123")
                  continue
              if re.match(r"^[-*]\s*\[[ xX]\]", s):   # "- [ ] ..." checklist row
                  continue
              if s in boilerplate:                    # unchanged template line
                  continue
              prose.append(s)
          summary = " ".join(prose).strip()

          # Issue reference: a real "#<number>", or the explicit "no issue" opt-out
          # — searched in the authored (comment-stripped) text only.
          has_ref = bool(re.search(r"#\d+", authored)) or bool(
              re.search(r"\bno[ -]?issue\b", authored, re.I)
          )

          MIN_PROSE = 20
          errors = []
          if len(summary) < MIN_PROSE:
              errors.append(
                  f"description is empty, unchanged from the template, or too short "
                  f"— write a real summary (>= {MIN_PROSE} chars of your own prose)."
              )
          if not has_ref:
              errors.append(
                  "no linked issue — add 'Closes #N' (or 'Relates to #N'), "
                  "or write 'no issue' if this PR genuinely touches none."
              )

          if errors:
              print("PR description lint failed:")
              for e in errors:
                  print(f"  - {e}")
              print(
                  "\nEdit the PR description to fix these. See the PR template's "
                  "'Summary' and 'Related issues' sections."
              )
              sys.exit(1)
          print("PR description OK: has a summary and an issue reference.")
          PY
