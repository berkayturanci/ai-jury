# ------------------------------------------------------------------------------
# 🏛️ AI Jury — Universal Agent Provider Example Configuration
# ------------------------------------------------------------------------------
# This configuration demonstrates all supported agent provider types:
# 1. Vendor CLIs (Claude, Codex, Antigravity)
# 2. Hosted HTTP APIs (OpenRouter, DeepSeek, Groq, xAI Grok, Moonshot Kimi)
# 3. Local Models (Ollama, LM Studio, vLLM)
# 4. Terminal Coding CLI Agents (Cursor CLI, Aider CLI)
# ------------------------------------------------------------------------------

# There is no `[jury] panel` key. The panel is every `[[agent]]` below that is
# not marked `enabled = false`, so this file — which catalogues one seat per
# provider type — disables the seats outside its demonstration panel of
# claude + codex + grok + cursor. Delete an `enabled = false` line to seat that
# provider instead, or set it on a seat you want to keep configured but silent.
[jury]
chair = "claude"
rounds = 2
verify = true
timeout = 600
parallel = true
routing = "standard"   # "standard" | "tiered" (risk-aware cost optimization)
hints = false          # true | false (fast local linter pre-pass)

[jury.ci]
fail_on = ["critical", "major"]
ignore_unverified = true

[jury.context]
mode = "diff-only"
redact_secrets = true


# ------------------------------------------------------------------------------
# 1. Native Vendor CLIs
# ------------------------------------------------------------------------------

# Anthropic Claude Code CLI
[[agent]]
name = "claude"
vendor = "anthropic"
command = "claude"
# No tools for the reviewer: no file reads, no shell, no network, no MCP servers,
# no CLAUDE.md/hooks/skills/plugins, and no transcript of the diff kept.
extra_args = [
  "--output-format",
  "text",
  "--tools",
  "",
  "--disallowed-tools",
  "Edit,Write,NotebookEdit,Bash,Read,Grep,Glob,WebFetch,WebSearch,Task,Agent",
  "--strict-mcp-config",
  "--safe-mode",
  "--no-session-persistence",
  "--permission-mode",
  "dontAsk",
]

# OpenAI Codex CLI
[[agent]]
name = "codex"
vendor = "openai"
command = "codex"
extra_args = ["-s", "read-only"]

# Google Antigravity CLI — opt-in only, and disabled here. agy is not in the
# default panel because it cannot be confined for untrusted diffs: measured on
# agy 1.2.9, `--sandbox` did not stop it reading or writing files or reaching
# the network, and it has no flag that removes its tools. Enable it only for
# diffs you trust; every run with it enabled warns, and `--strict` fails.
[[agent]]
name = "agy"
vendor = "google"
command = "agy"
extra_args = ["--dangerously-skip-permissions", "--sandbox"]
enabled = false


# ------------------------------------------------------------------------------
# 2. Hosted OpenAI-Compatible REST APIs (vendor = "openai-compatible")
# ------------------------------------------------------------------------------
# These reach a NON-loopback host, refused by default so a config file cannot silently
# point the API key at an arbitrary server. Export the opt-in before using any of them
# (env-only on purpose, never a config key):  export JURY_ALLOW_REMOTE_ENDPOINT=1
# Without it, `jury --config-validate` rejects each seat below by design.

# OpenRouter (Unified API Gateway)
[[agent]]
name = "openrouter-claude"
vendor = "openai-compatible"
model = "anthropic/claude-opus-5.5"
endpoint = "https://openrouter.ai/api/v1/chat/completions"
api_key_env = "OPENROUTER_API_KEY"
enabled = false

# DeepSeek API (V4 Pro)
[[agent]]
name = "deepseek"
vendor = "openai-compatible"
model = "deepseek-v4-pro"
endpoint = "https://api.deepseek.com/v1/chat/completions"
api_key_env = "DEEPSEEK_API_KEY"
enabled = false

# Groq Ultra-Fast Llama Inference API
[[agent]]
name = "groq"
vendor = "openai-compatible"
model = "llama-3.3-70b-versatile"
endpoint = "https://api.groq.com/openai/v1/chat/completions"
api_key_env = "GROQ_API_KEY"
enabled = false

# xAI Grok API
[[agent]]
name = "grok"
vendor = "openai-compatible"
model = "grok-4.7"
endpoint = "https://api.x.ai/v1/chat/completions"
api_key_env = "XAI_API_KEY"

# Moonshot / Kimi API Direct
[[agent]]
name = "kimi"
vendor = "openai-compatible"
model = "kimi-k3"
endpoint = "https://api.moonshot.cn/v1/chat/completions"
api_key_env = "MOONSHOT_API_KEY"
enabled = false

# OmniRoute / Unified LLM Gateway & Proxy (LiteLLM, One API)
[[agent]]
name = "omni-claude"
vendor = "openai-compatible"
model = "anthropic/claude-opus-5.5"
endpoint = "http://localhost:8000/v1/chat/completions"
api_key_env = "OMNIROUTE_API_KEY"
enabled = false


# ------------------------------------------------------------------------------
# 3. Local Model Servers (Ollama, LM Studio, vLLM)
# ------------------------------------------------------------------------------

# Local Ollama Server (vendor = "local")
[[agent]]
name = "local-ollama"
vendor = "local"
model = "qwen2.5-coder:14b"
endpoint = "http://localhost:11434/v1"
enabled = false

# LM Studio / vLLM Server
[[agent]]
name = "local-lmstudio"
vendor = "local"
model = "local-model"
endpoint = "http://localhost:1234/v1"
enabled = false


# ------------------------------------------------------------------------------
# 4. Terminal Coding CLI Agents (vendor = "cli")
# ------------------------------------------------------------------------------

# Both seats below are unsandboxed — runs with your permissions: jury adds or checks
# no sandbox for a bring-your-own CLI, and the least-privilege audit warns about each
# (`--strict` fails the run on them). Their flags ask the CLI for its own read-only
# mode — never add `--force`/`--yolo` (Cursor) or `--yes-always` (aider) — but they run
# in the checkout jury starts in, and read its config: seat them only on checkouts you
# trust. See docs/configuration.md.

# Cursor CLI Agent (standalone cursor-agent binary with model selection)
# unsandboxed — runs with your permissions. `--mode ask` is Cursor's read-only mode and
# `--sandbox enabled` its sandbox; `--print` alone can write files. `--trust` lets a headless
# run start without a trust prompt — and trusts the checkout's `.cursor/` hooks too.
[[agent]]
name = "cursor"
vendor = "cli"
command = "cursor-agent"
extra_args = ["--print", "--trust", "--mode", "ask", "--sandbox", "enabled", "--model", "claude-4.6-sonnet-medium", "--output-format", "text"]

# Aider CLI Agent
# unsandboxed — runs with your permissions. Ask mode, as a dry run, with no commits; `--message`
# stays last because the prompt is appended after it. aider still reads `.aider.conf.yml`
# and `.env` from the checkout, which can turn on its test/lint/load commands.
[[agent]]
name = "aider"
vendor = "cli"
command = "aider"
extra_args = ["--chat-mode", "ask", "--dry-run", "--no-auto-commits", "--no-dirty-commits", "--no-suggest-shell-commands", "--no-auto-lint", "--no-detect-urls", "--no-gitignore", "--message"]
prompt_mode = "arg"
enabled = false
