<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="ai-jury: a diff enters; universal agent providers — Claude Code, Codex, Antigravity, DeepSeek, Grok, Cursor CLI, and free local models — review it, debate, verify, and reach one verdict.">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ff"></stop>
      <stop offset="1" stop-color="#f8faff"></stop>
    </linearGradient>
    <radialGradient id="glowL" cx="80%" cy="-5%" r="65%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.14"></stop>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glow2L" cx="6%" cy="105%" r="55%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.10"></stop>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="coreL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"></stop>
      <stop offset="1" stop-color="#4f46e5"></stop>
    </linearGradient>
    <linearGradient id="verdL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"></stop>
      <stop offset="1" stop-color="#059669"></stop>
    </linearGradient>
    <linearGradient id="titleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5457ec"></stop>
      <stop offset="0.7" stop-color="#9333ea"></stop>
      <stop offset="1" stop-color="#5457ec"></stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgL)"></rect>
  <rect width="1200" height="630" fill="url(#glowL)"></rect>
  <rect width="1200" height="630" fill="url(#glow2L)"></rect>

  <!-- Logo + Title -->
  <g transform="translate(64,54)">
    <rect width="56" height="56" rx="14" fill="#0f172a" stroke="#cdd6ec"></rect>
    <circle cx="28" cy="28" r="16.5" fill="none" stroke="#334155" stroke-width="1.5"></circle>
    <g stroke="#475569" stroke-width="1.6" stroke-linecap="round">
      <line x1="28" y1="28" x2="28" y2="12.5"></line><line x1="28" y1="28" x2="43.5" y2="28"></line>
      <line x1="28" y1="28" x2="28" y2="43.5"></line><line x1="28" y1="28" x2="12.5" y2="28"></line>
    </g>
    <circle cx="28" cy="12.5" r="4" fill="#d97757"></circle><circle cx="43.5" cy="28" r="4" fill="#10a37f"></circle>
    <circle cx="28" cy="43.5" r="4" fill="#4285f4"></circle><circle cx="12.5" cy="28" r="4" fill="#a855f7"></circle>
    <circle cx="28" cy="28" r="7.4" fill="url(#coreL)"></circle>
    <path d="M24.8 28.2 L27 30.4 L31.2 26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="72" y="38" fill="#0c1322" font-size="34" font-weight="700" letter-spacing="-0.5">ai-jury</text>
  </g>

  <!-- Hero Headings -->
  <text x="64" y="186" fill="#0c1322" font-size="52" font-weight="700" letter-spacing="-1.5">Install once. Run a</text>
  <text x="64" y="246" fill="url(#titleL)" font-size="52" font-weight="700" letter-spacing="-1.5">cross-vendor review jury</text>
  <text x="64" y="306" fill="#0c1322" font-size="52" font-weight="700" letter-spacing="-1.5">anywhere.</text>
  <text x="66" y="350" fill="#515d77" font-size="20" font-weight="400" font-family="'IBM Plex Sans', sans-serif">Universal agent providers review the same diff, debate each other, and reach one verdict.</text>

  <!-- Interactive Pipeline -->
  <g transform="translate(66,396) scale(0.925)">
    <!-- Connecting flow lines -->
    <g stroke="#dbe2f2" stroke-width="2" fill="none">
      <line x1="150" y1="104" x2="196" y2="104"></line>
      <line x1="470" y1="104" x2="516" y2="104"></line>
      <line x1="640" y1="104" x2="686" y2="104"></line>
      <line x1="810" y1="104" x2="856" y2="104"></line>
      <line x1="980" y1="104" x2="996" y2="104"></line>
    </g>
    <circle cx="173" cy="104" r="3.5" fill="#6366f1"></circle>
    <circle cx="663" cy="104" r="3.5" fill="#6366f1"></circle>
    <circle cx="833" cy="104" r="3.5" fill="#6366f1"></circle>

    <!-- Stage 0: INPUT -->
    <rect x="0" y="68" width="150" height="72" rx="14" fill="#ffffff" stroke="#e2e7f3"></rect>
    <text x="75" y="100" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="'JetBrains Mono', monospace">INPUT</text>
    <text x="75" y="122" fill="#0c1322" font-size="18" font-weight="600" text-anchor="middle">diff / PR</text>

    <!-- Stage 1: REVIEWERS (Universal Providers) -->
    <g>
      <!-- Claude -->
      <rect x="196" y="2" width="274" height="30" rx="8" fill="#ffffff" stroke="#d97757"></rect>
      <circle cx="214" cy="17" r="4" fill="#d97757"></circle><text x="226" y="22" fill="#0c1322" font-size="13" font-weight="600">Claude Code</text><text x="452" y="22" fill="#8a96ad" font-size="11" text-anchor="end" font-family="'JetBrains Mono', monospace">claude</text>

      <!-- Codex -->
      <rect x="196" y="36" width="274" height="30" rx="8" fill="#ffffff" stroke="#10a37f"></rect>
      <circle cx="214" cy="51" r="4" fill="#10a37f"></circle><text x="226" y="56" fill="#0c1322" font-size="13" font-weight="600">OpenAI Codex</text><text x="452" y="56" fill="#8a96ad" font-size="11" text-anchor="end" font-family="'JetBrains Mono', monospace">codex</text>

      <!-- Antigravity -->
      <rect x="196" y="70" width="274" height="30" rx="8" fill="#ffffff" stroke="#4285f4"></rect>
      <circle cx="214" cy="85" r="4" fill="#4285f4"></circle><text x="226" y="90" fill="#0c1322" font-size="13" font-weight="600">Antigravity</text><text x="452" y="90" fill="#8a96ad" font-size="11" text-anchor="end" font-family="'JetBrains Mono', monospace">agy</text>

      <!-- DeepSeek / Grok / APIs -->
      <rect x="196" y="104" width="274" height="30" rx="8" fill="#ffffff" stroke="#0891b2"></rect>
      <circle cx="214" cy="119" r="4" fill="#0891b2"></circle><text x="226" y="124" fill="#0c1322" font-size="13" font-weight="600">DeepSeek · Grok · APIs</text><text x="452" y="124" fill="#0891b2" font-size="11" text-anchor="end" font-family="'JetBrains Mono', monospace">hosted</text>

      <!-- Cursor CLI / Aider -->
      <rect x="196" y="138" width="274" height="30" rx="8" fill="#ffffff" stroke="#db2777"></rect>
      <circle cx="214" cy="153" r="4" fill="#db2777"></circle><text x="226" y="158" fill="#0c1322" font-size="13" font-weight="600">Cursor CLI · Aider</text><text x="452" y="158" fill="#db2777" font-size="11" text-anchor="end" font-family="'JetBrains Mono', monospace">cli</text>

      <!-- Local / Free -->
      <rect x="196" y="172" width="274" height="30" rx="8" fill="#ffffff" stroke="#a855f7"></rect>
      <circle cx="214" cy="187" r="4" fill="#a855f7"></circle><text x="226" y="192" fill="#0c1322" font-size="13" font-weight="600">Local (Ollama / LM Studio)</text><text x="452" y="192" fill="#059669" font-size="11" text-anchor="end" font-family="'JetBrains Mono', monospace">free</text>
    </g>

    <!-- Stage 2: ROUND 2 (debate) -->
    <rect x="516" y="68" width="124" height="72" rx="14" fill="#ffffff" stroke="#e2e7f3"></rect>
    <text x="578" y="100" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="'JetBrains Mono', monospace">ROUND 2</text>
    <text x="578" y="122" fill="#0c1322" font-size="17" font-weight="600" text-anchor="middle">debate ⇄</text>

    <!-- Stage 3: CHECK (verify) -->
    <rect x="686" y="68" width="124" height="72" rx="14" fill="#ffffff" stroke="#e2e7f3"></rect>
    <text x="748" y="100" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="'JetBrains Mono', monospace">CHECK</text>
    <text x="748" y="122" fill="#0c1322" font-size="17" font-weight="600" text-anchor="middle">verify</text>

    <!-- Stage 4: SYNTHESIS (chair / vote) -->
    <rect x="856" y="68" width="124" height="72" rx="14" fill="#ffffff" stroke="#a5b0f0"></rect>
    <text x="918" y="100" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="'JetBrains Mono', monospace">SYNTHESIS</text>
    <text x="918" y="122" fill="#5457ec" font-size="18" font-weight="700" text-anchor="middle">chair</text>

    <!-- Stage 5: VERDICT -->
    <rect x="996" y="68" width="156" height="72" rx="14" fill="#ffffff" stroke="#6ee7b7"></rect>
    <text x="1074" y="98" fill="#8a96ad" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" font-family="'JetBrains Mono', monospace">VERDICT</text>
    <rect x="1018" y="106" width="112" height="26" rx="7" fill="url(#verdL)"></rect>
    <text x="1074" y="124" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">✓ APPROVE</text>
  </g>

  <!-- Footer tagline -->
  <text x="64" y="612" fill="#8a96ad" font-size="14" font-family="'JetBrains Mono', monospace">stdlib-only Python · local-first · MIT · universal agent providers</text>
</svg>