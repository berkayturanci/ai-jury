<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ai-jury: a diff enters; four reviewers — Claude Code, Codex, Antigravity, and a free local/open-weight model — review it independently and debate; a chair agent verifies findings and synthesizes one verdict and report.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="verdict" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>

  <!-- title + tagline -->
  <text x="60" y="70" fill="#f8fafc" font-size="38" font-weight="700">🏛️ ai-jury</text>
  <text x="60" y="104" fill="#94a3b8" font-size="20" font-weight="400">Install once. Run a cross-vendor review jury anywhere.</text>

  <!-- input: diff / PR -->
  <g>
    <rect x="60" y="222" width="150" height="120" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="270" fill="#cbd5e1" font-size="17" font-weight="600" text-anchor="middle">diff / PR</text>
    <text x="135" y="298" fill="#64748b" font-size="13" text-anchor="middle">gh · file · stdin</text>
    <text x="135" y="318" fill="#64748b" font-size="13" text-anchor="middle">redact · filter · chunk</text>
  </g>

  <!-- arrow in -->
  <line x1="210" y1="282" x2="270" y2="282" stroke="#475569" stroke-width="2.5"/>
  <polygon points="270,282 260,276 260,288" fill="#475569"/>

  <!-- four reviewers (parallel, independent) -->
  <g>
    <rect x="280" y="140" width="230" height="62" rx="12" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <circle cx="312" cy="171" r="9" fill="#d97757"/>
    <text x="332" y="167" fill="#f1f5f9" font-size="16" font-weight="600">Claude Code</text>
    <text x="332" y="187" fill="#64748b" font-size="12">claude -p</text>

    <rect x="280" y="212" width="230" height="62" rx="12" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <circle cx="312" cy="243" r="9" fill="#10a37f"/>
    <text x="332" y="239" fill="#f1f5f9" font-size="16" font-weight="600">Codex</text>
    <text x="332" y="259" fill="#64748b" font-size="12">codex exec</text>

    <rect x="280" y="284" width="230" height="62" rx="12" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <circle cx="312" cy="315" r="9" fill="#4285f4"/>
    <text x="332" y="311" fill="#f1f5f9" font-size="16" font-weight="600">Antigravity</text>
    <text x="332" y="331" fill="#64748b" font-size="12">agy --print</text>

    <rect x="280" y="356" width="230" height="62" rx="12" fill="#0b1220" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="312" cy="387" r="9" fill="#a855f7"/>
    <text x="332" y="383" fill="#f1f5f9" font-size="16" font-weight="600">Local / open-weight</text>
    <text x="332" y="403" fill="#94a3b8" font-size="12">Ollama /v1 · free · offline</text>
  </g>

  <!-- debate arrows between adjacent reviewers -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.8">
    <line x1="395" y1="202" x2="395" y2="212"/>
    <line x1="395" y1="274" x2="395" y2="284"/>
    <line x1="395" y1="346" x2="395" y2="356"/>
  </g>
  <text x="448" y="129" fill="#818cf8" font-size="13" font-weight="600" text-anchor="middle">debate ⇄</text>

  <!-- arrows reviewers -> chair -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M510 171 C 590 171, 600 232, 660 238"/>
    <path d="M510 243 C 590 243, 610 252, 660 256"/>
    <path d="M510 315 C 590 315, 610 276, 660 272"/>
    <path d="M510 387 C 590 387, 600 296, 660 288"/>
  </g>

  <!-- chair -->
  <rect x="660" y="212" width="190" height="100" rx="14" fill="url(#chair)"/>
  <text x="755" y="252" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">chair agent</text>
  <text x="755" y="278" fill="#e0e7ff" font-size="13" text-anchor="middle">verifies findings</text>
  <text x="755" y="296" fill="#e0e7ff" font-size="13" text-anchor="middle">+ synthesizes</text>

  <!-- arrow chair -> verdict -->
  <line x1="850" y1="262" x2="912" y2="262" stroke="#475569" stroke-width="2.5"/>
  <polygon points="912,262 902,256 902,268" fill="#475569"/>

  <!-- verdict / report -->
  <rect x="922" y="202" width="218" height="120" rx="14" fill="url(#verdict)"/>
  <text x="1031" y="246" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">one verdict</text>
  <text x="1031" y="272" fill="#d1fae5" font-size="13" text-anchor="middle">APPROVE · COMMENT</text>
  <text x="1031" y="290" fill="#d1fae5" font-size="13" text-anchor="middle">REQUEST CHANGES</text>
  <text x="1031" y="308" fill="#d1fae5" font-size="13" text-anchor="middle">+ report · CI gate</text>

  <!-- phase labels -->
  <text x="395" y="448" fill="#64748b" font-size="13" text-anchor="middle">round 1: independent review (incl. local)</text>
  <text x="755" y="448" fill="#64748b" font-size="13" text-anchor="middle">round 2 (adaptive) · verify · synthesis</text>

  <!-- footer note -->
  <text x="60" y="492" fill="#475569" font-size="13">Native vendor CLIs + a free local / open-weight model — not API calls. Stdlib-only Python. Local-first.</text>
</svg>
