<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="agent-review-council: a diff enters, three native vendor agents (Claude Code, Codex, Antigravity) review it independently and debate, then a chair agent synthesizes one verdict and report.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="verdict" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>

  <!-- title + tagline -->
  <text x="60" y="74" fill="#f8fafc" font-size="38" font-weight="700">🏛️ agent-review-council</text>
  <text x="60" y="110" fill="#94a3b8" font-size="20" font-weight="400">Install once. Run a cross-vendor review council anywhere.</text>

  <!-- input: diff / PR -->
  <g>
    <rect x="60" y="200" width="150" height="120" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="248" fill="#cbd5e1" font-size="17" font-weight="600" text-anchor="middle">diff / PR</text>
    <text x="135" y="276" fill="#64748b" font-size="13" text-anchor="middle">gh · file · stdin</text>
    <text x="135" y="296" fill="#64748b" font-size="13" text-anchor="middle">diff-only context</text>
  </g>

  <!-- arrow in -->
  <line x1="210" y1="260" x2="270" y2="260" stroke="#475569" stroke-width="2.5"/>
  <polygon points="270,260 260,254 260,266" fill="#475569"/>

  <!-- three vendor reviewers (parallel, independent) -->
  <g>
    <rect x="280" y="150" width="230" height="74" rx="12" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <circle cx="312" cy="187" r="9" fill="#d97757"/>
    <text x="332" y="182" fill="#f1f5f9" font-size="17" font-weight="600">Claude Code</text>
    <text x="332" y="204" fill="#64748b" font-size="13">claude -p</text>

    <rect x="280" y="244" width="230" height="74" rx="12" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <circle cx="312" cy="281" r="9" fill="#10a37f"/>
    <text x="332" y="276" fill="#f1f5f9" font-size="17" font-weight="600">Codex</text>
    <text x="332" y="298" fill="#64748b" font-size="13">codex exec</text>

    <rect x="280" y="338" width="230" height="74" rx="12" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
    <circle cx="312" cy="375" r="9" fill="#4285f4"/>
    <text x="332" y="370" fill="#f1f5f9" font-size="17" font-weight="600">Antigravity</text>
    <text x="332" y="392" fill="#64748b" font-size="13">agy --print</text>
  </g>

  <!-- debate arrows between reviewers -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.8">
    <line x1="395" y1="224" x2="395" y2="244"/>
    <line x1="395" y1="318" x2="395" y2="338"/>
  </g>
  <text x="528" y="266" fill="#818cf8" font-size="13" font-weight="600">debate ⇄</text>

  <!-- arrows reviewers -> chair -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M510 187 C 590 187, 600 245, 660 258"/>
    <path d="M510 281 L 660 270"/>
    <path d="M510 375 C 590 375, 600 290, 660 282"/>
  </g>

  <!-- chair -->
  <rect x="660" y="210" width="190" height="100" rx="14" fill="url(#chair)"/>
  <text x="755" y="252" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">chair agent</text>
  <text x="755" y="278" fill="#e0e7ff" font-size="13" text-anchor="middle">synthesizes</text>
  <text x="755" y="296" fill="#e0e7ff" font-size="13" text-anchor="middle">+ verifies findings</text>

  <!-- arrow chair -> verdict -->
  <line x1="850" y1="260" x2="912" y2="260" stroke="#475569" stroke-width="2.5"/>
  <polygon points="912,260 902,254 902,266" fill="#475569"/>

  <!-- verdict / report -->
  <rect x="922" y="200" width="218" height="120" rx="14" fill="url(#verdict)"/>
  <text x="1031" y="244" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">one verdict</text>
  <text x="1031" y="270" fill="#d1fae5" font-size="13" text-anchor="middle">APPROVE · COMMENT</text>
  <text x="1031" y="288" fill="#d1fae5" font-size="13" text-anchor="middle">REQUEST CHANGES</text>
  <text x="1031" y="306" fill="#d1fae5" font-size="13" text-anchor="middle">+ markdown report</text>

  <!-- phase labels -->
  <text x="395" y="448" fill="#64748b" font-size="13" text-anchor="middle">round 1: independent review</text>
  <text x="755" y="448" fill="#64748b" font-size="13" text-anchor="middle">round 2 + synthesis</text>

  <!-- footer note -->
  <text x="60" y="492" fill="#475569" font-size="13">Native vendor CLIs — not API calls. Stdlib-only Python. Local-first.</text>
</svg>
