# keel consumer config (generated by `keel init`)
extends: keel
core_version: "^1.0"
owner: "berkayturanci"
repo: "ai-jury"
base_branch: "main"
platform: "python"
consent_mode: "explicit"

knobs:
  build_gate_cmd: "make test"
  lint_cmd: "ruff check ."
  tier3_globs:
    - "src/ai_jury/adapters.py"
    - "src/ai_jury/privilege.py"
    - "src/ai_jury/redaction.py"
    - "src/ai_jury/injection.py"
    - "src/ai_jury/config.py"
    - ".github/workflows/**"

# The review-evidence chain is NOT configured here, and its absence from this
# list is not the gap #602 looked for — keel's own `projects/keel.yaml` declares
# the same two gates. The reviewer contract is derived from `tier3_globs` above
# and enforced by `.github/workflows/keel-ship.yml`, which runs
# `keel evidence-verify --phase pre-merge --require-armed` and publishes the
# result as the `keel evidence (required)` check-run.
#
# That check is *required* in branch protection, so it blocks (#620). It was
# advisory for a day between #602 landing and the operator requiring it, which
# is the state to watch for: a gate that reports and does not gate looks
# identical to one that works.
#
# `--no-jury` is passed at the call site: tier-3 auto-enables a gating jury
# verdict, and a paid cross-vendor panel per PR is not this repository's cost
# posture. It drops only that verdict — tier-3 still requires three distinct
# reviewer verdicts.
gates: [build, lint]
extensions: {}
extensions_dir: .keel/extensions
