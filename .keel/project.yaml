# keel project config — ai-jury (Python; cross-vendor jury + deliberation theater)
extends: keel
core_version: "^1.6"
owner: berkayturanci
repo: ai-jury
base_branch: main
platform: python
timezone: Europe/Istanbul
merge_window: "07:00-01:30"

knobs:
  implementer_agents:
    core: backend-developer
  build_gate_cmd: "make test"
  lint_cmd: "make lint"
  tier3_globs:
    - "src/ai_jury/orchestrator.py"
    - "src/ai_jury/config.py"
    - "src/ai_jury/adapters.py"
    - "src/ai_jury/cli.py"
    - ".github/workflows/**"
  ci_workflows:
    "CI": "**"
  docs_gate_paths: ["docs/**", "*.md", "README.md"]
  sot_doc: CLAUDE.md

gates: [build, lint]

extensions: {}
extensions_dir: .keel/extensions

policy_pack:
  name: ai-jury-python
  labels:
    status: ["status:backlog", "status:in-progress", "status:needs-review", "status:done"]
    priority: ["priority:high", "priority:medium", "priority:low"]
    role: ["core"]
  status_transitions:
    start: "status:in-progress"
    review: "status:needs-review"
    done: "status:done"
  risk_rules:
    - id: core-contract
      paths: ["src/ai_jury/config.py", "src/ai_jury/adapters.py", "src/ai_jury/orchestrator.py"]
      required_gates: ["build", "lint"]
      review_additions: ["Check vendor-adapter compatibility and verdict determinism."]
      docs_required: true
  test_groups:
    unit:
      command: "make test"
      paths: ["src/**", "tests/**"]
      required_capabilities: ["shell"]
  docs:
    required_paths: ["docs/**", "README.md"]
    allow_none_reasons: ["No user-facing behavior or config contract changed."]
    impact_required: true
  health_providers:
    ci:
      kind: github-checks
      optional_capabilities: ["gh", "github-mcp"]
  scan:
    areas:
      core: ["src/ai_jury/**"]
      tests: ["tests/**"]
      docs: ["docs/**", "README.md"]
      workflows: [".github/workflows/**"]
    active_branch_patterns: ["feat/**", "fix/**", "chore/**", "docs/**"]
    issue_labels:
      regression: ["type:bug", "source:regression-scan"]
      review-all-day: ["type:bug", "source:review-all-day"]
    near_text_similarity: 0.6
    batch_threshold: 5
    large_diff_max_bytes: 200000
  command_routing:
    implement:
      agent_role: core
      paths: ["src/**", "tests/**", "docs/**"]
      required_capabilities: ["shell", "git"]
      side_effects: ["file_edit", "git_commit"]
      dry_run_safe: false
  reports:
    session: "docs/session-reports/"
  review:
    additions: ["Reject vendor-specific hacks in shared jury contracts."]
    required_sections: ["Testing", "Docs Impact"]
