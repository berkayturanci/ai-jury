# keel consumer config (generated by `keel init`)
extends: keel
core_version: "^1.0"
owner: "berkayturanci"
repo: "ai-jury"
base_branch: "main"
platform: "python"
consent_mode: "explicit"

knobs:
  build_gate_cmd: "make test"
  lint_cmd: "ruff check ."
  tier3_globs:
    - "src/ai_jury/adapters.py"
    - "src/ai_jury/privilege.py"
    - "src/ai_jury/redaction.py"
    - "src/ai_jury/injection.py"
    - "src/ai_jury/config.py"
    - ".github/workflows/**"

# This file configures keel when *you* run it — `/keel:ship`, `keel review`,
# `keel merge` from a checkout. Nothing in CI reads it.
#
# There used to be a merge gate: `.github/workflows/keel-ship.yml` ran
# `keel evidence-verify --phase pre-merge --require-armed` on every pull request
# and published the verdict as the `keel evidence (required)` check-run, which
# branch protection required (#602, #620). Both the workflow and that
# branch-protection entry were removed in #801.
#
# Why: the gate demanded three distinct reviewer verdicts posted as PR comments
# for any diff touching `tier3_globs`. Pull requests here are opened without
# running `keel ship`, so the gate had no evidence to verify and reported
# `Evidence verification failed` on every one of them — a required check that is
# always red is a check that gets ignored, and it blocked merges that had passed
# every gate anyone was actually reading (tests on five legs, coverage, ruff,
# CodeQL, PR-description lint).
#
# `tier3_globs` above is kept because it still marks the sensitive surface for a
# keel run you start yourself. It no longer gates anything automatically. If the
# evidence chain is ever restored, restore `--no-jury` with it: tier-3
# auto-enables a *gating* jury verdict, and a paid cross-vendor panel per pull
# request is not this repository's cost posture.
gates: [build, lint]
extensions: {}
extensions_dir: .keel/extensions
